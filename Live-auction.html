
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KMPL Season 05 LIVE Auction</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101010;color:#fff;font-family:Arial,sans-serif}
header{text-align:center;padding:22px 10px;background:#050505;border-bottom:2px solid #e6b800}
header h1{margin:0;font-size:27px}
header p{color:#bbb;margin:8px 0 0}
main{max-width:850px;margin:auto;padding:16px}
.card{background:#1d1d1d;border-radius:16px;padding:18px;margin-bottom:15px}
.badge{display:inline-block;background:#e6b800;color:#111;font-weight:bold;padding:8px 14px;border-radius:20px}
#status{margin-top:10px;color:#bbb}
#photo{width:100%;max-height:360px;object-fit:contain;background:#080808;border-radius:12px}
#name{font-size:28px;font-weight:bold;margin:14px 0 5px;overflow-wrap:anywhere}
#bid{font-size:38px;color:#2ecc71;font-weight:bold;margin:12px 0}
.details{color:#ccc;line-height:1.8;overflow-wrap:anywhere}
h2{font-size:18px}
.history{border-top:1px solid #383838;padding:10px 0;overflow-wrap:anywhere}
.muted{color:#aaa}
</style>
</head>
<body>
<header>
  <h1>KMPL SEASON 05</h1>
  <p>PUBLIC LIVE AUCTION</p>
</header>
<main>
  <div class="card">
    <span class="badge" id="badge">CONNECTING...</span>
    <div id="status">Connecting to auction server...</div>
  </div>
  <div class="card">
    <div id="round" class="muted">Auction round</div>
    <img id="photo" alt="Player photo" style="display:none">
    <div id="name">Waiting for auction...</div>
    <div id="reg" class="muted"></div>
    <div id="bid">₹1,000</div>
    <div id="details" class="details"></div>
  </div>
  <div class="card">
    <h2>Recent Auction Results</h2>
    <div id="history" class="muted">No results published yet.</div>
  </div>
  <p class="muted" style="text-align:center">LIVE updates automatically. This page is view-only.</p>
</main>
<script>
const API_URL =
"https://script.google.com/macros/s/AKfycbx4_dUYrVPQEQjjWThl0q2vxYTt1SntdunMQbkN7LSV3t3JwiPhJgYTVkJQMJiI8PduSA/exec";

function text(id,value){
  document.getElementById(id).textContent = value || "-";
}
function photoUrl(value){
  if(!value) return "";
  value=String(value).trim();
  const m=value.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/)
    || value.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  if(m) return "https://drive.google.com/thumbnail?id="+encodeURIComponent(m[1])+"&sz=w1000";
  return /^https?:\/\//i.test(value) ? value : "";
}
function render(s){
  if(!s){
    text("badge","WAITING");
    text("status","Waiting for Admin to publish LIVE...");
    return;
  }

  const state=String(s.auctionStatus || "LIVE").toUpperCase();
  text("badge",state);
  text("status","Last update: "+(s.updatedAt || "Connected"));
  text("round",s.round==="UNSOLD"?"UNSOLD ROUND":"KMPL SEASON 05 AUCTION");

  text("name",s.name || (
    state==="AUCTION COMPLETED" ? "Auction Completed" :
    state==="ROUND COMPLETE" ? "Round Completed" :
    "Waiting for next player"
  ));
  text("reg",s.registrationNumber || "");
  text("bid","₹"+Number(s.currentBid || s.basePrice || 1000).toLocaleString("en-IN"));

  const details=[
    "Place: "+(s.place||"-"),
    "Role: "+(s.role||"-"),
    "Batting: "+(s.battingStyle||"-"),
    "Bowling: "+(s.bowlingStyle||"-"),
    "Previous team: "+(s.previousTeam||"-"),
    "Sold team: "+(s.soldTeam||"-")
  ];
  text("details",details.join("\n"));

  const img=document.getElementById("photo");
  const src=photoUrl(s.photo);
  if(src && img.src!==src){
    img.onerror=()=>{img.style.display="none"};
    img.onload=()=>{img.style.display="block"};
    img.src=src;
  }else if(!src){
    img.removeAttribute("src");
    img.style.display="none";
  }

  const hist=document.getElementById("history");
  hist.replaceChildren();
  if(Array.isArray(s.history) && s.history.length){
    s.history.forEach(item=>{
      const div=document.createElement("div");
      div.className="history";
      const price=item.soldPrice ? " — ₹"+Number(item.soldPrice).toLocaleString("en-IN") : "";
      div.textContent=(item.name||"Player")+" — "+(item.status||"")+
        (item.soldTeam ? " — "+item.soldTeam : "")+price;
      hist.appendChild(div);
    });
  }else{
    hist.textContent="No results published yet.";
  }
}
async function refresh(){
  try{
    const response=await fetch(API_URL+"?action=liveState&_="+Date.now(),{
      cache:"no-store"
    });
    if(!response.ok) throw new Error("HTTP "+response.status);
    const data=await response.json();
    if(data.success) render(data.state || null);
    else throw new Error(data.message || "Unable to read LIVE state");
  }catch(e){
    text("badge","CONNECTION ERROR");
    text("status",e.message+" — retrying...");
  }
}
refresh();
setInterval(refresh,3000);
</script>
</body>
</html>
