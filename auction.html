<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>KMPL Season 05 Auction</title><style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#101010;
  color:white;
}

.header{
  text-align:center;
  padding:20px 10px;
  background:#000;
}

.header h1{
  margin:0;
  font-size:30px;
}

.header p{
  margin:8px 0 0;
  color:#aaa;
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

.card{
  background:#1c1c1c;
  border-radius:18px;
  padding:20px;
}

.photo-box{
  width:100%;
  max-width:420px;
  height:420px;
  margin:auto;
  background:#000;
  border-radius:15px;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}

.photo-box img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.reg{
  text-align:center;
  color:#aaa;
  margin-top:15px;
}

.player-name{
  text-align:center;
  font-size:34px;
  font-weight:bold;
  margin:8px 0;
}

.place{
  text-align:center;
  color:#bbb;
}

.details{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:20px;
}

.detail{
  background:#292929;
  padding:13px;
  border-radius:10px;
}

.detail span{
  display:block;
  color:#999;
  font-size:12px;
  margin-bottom:5px;
}

.auction-box{
  margin-top:25px;
  padding:20px;
  background:#000;
  border-radius:15px;
  text-align:center;
}

.base{
  color:#aaa;
}

.bid-label{
  color:#aaa;
  margin-top:10px;
}

.current-bid{
  font-size:42px;
  font-weight:bold;
  margin:8px 0 18px;
}

button{
  border:0;
  border-radius:10px;
  padding:14px 20px;
  margin:5px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.bid-btn{
  background:white;
  color:black;
  min-width:190px;
}

.sold-btn{
  background:#16a085;
  color:white;
  min-width:140px;
}

.unsold-btn{
  background:#d63031;
  color:white;
  min-width:140px;
}

.prev-btn,
.next-btn{
  background:#333;
  color:white;
  min-width:140px;
}

.fullscreen{
  background:#444;
  color:white;
}

.status{
  margin-top:15px;
  font-size:22px;
  font-weight:bold;
}

.nav{
  text-align:center;
  margin-top:20px;
}

.loading{
  text-align:center;
  padding:50px;
  font-size:20px;
}

.modal{
  display:none;
  position:fixed;
  left:0;
  top:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,.85);
  z-index:999;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal-box{
  width:100%;
  max-width:500px;
  background:#1e1e1e;
  padding:25px;
  border-radius:18px;
}

.modal-box h2{
  text-align:center;
}

.team{
  display:block;
  width:100%;
  background:#333;
  color:white;
  text-align:left;
}

.cancel{
  width:100%;
  background:#555;
  color:white;
}

@media(max-width:600px){

  .container{
    padding:10px;
  }

  .card{
    padding:12px;
  }

  .photo-box{
    height:350px;
  }

  .player-name{
    font-size:28px;
  }

  .details{
    grid-template-columns:1fr;
  }

  .current-bid{
    font-size:36px;
  }

  button{
    width:100%;
    margin:5px 0;
  }

}

</style></head><body><div class="header">
  <h1>KMPL SEASON 05</h1>
  <p>PLAYER AUCTION</p>
</div><div class="container">  <div id="loading" class="loading">
    Loading players...
  </div>  <div id="auctionCard"
       class="card"
       style="display:none;"><div class="photo-box">
  <img id="playerPhoto"
       src=""
       alt="Player Photo"
       onerror="photoError()">
</div>

<div id="playerReg" class="reg"></div>

<div id="playerName" class="player-name"></div>

<div id="playerPlace" class="place"></div>

<div class="details">

  <div class="detail">
    <span>Playing Role</span>
    <strong id="playerRole">-</strong>
  </div>

  <div class="detail">
    <span>Batting Style</span>
    <strong id="playerBatting">-</strong>
  </div>

  <div class="detail">
    <span>Bowling Style</span>
    <strong id="playerBowling">-</strong>
  </div>

  <div class="detail">
    <span>Previous Team</span>
    <strong id="playerTeam">-</strong>
  </div>

</div>

<div class="auction-box">

  <div class="base">
    Base Price: ₹1,000
  </div>

  <div class="bid-label">
    Current Bid
  </div>

  <div id="currentBid" class="current-bid">
    ₹1,000
  </div>

  <button class="bid-btn"
          onclick="decreaseBid()">
    − ₹1,000
  </button>

  <button class="bid-btn"
          onclick="increaseBid()">
    + ₹1,000
  </button>

  <br>

  <button class="sold-btn"
          onclick="openSoldModal()">
    SOLD
  </button>

  <button class="unsold-btn"
          onclick="markUnsold()">
    UNSOLD
  </button>

  <div id="auctionStatus" class="status"></div>

</div>

<div class="nav">

  <button class="prev-btn"
          onclick="previousPlayer()">
    ◀ PREVIOUS
  </button>

  <button class="next-btn"
          onclick="nextPlayer()">
    NEXT ▶
  </button>

  <br>

  <button class="fullscreen"
          onclick="toggleFullscreen()">
    ⛶ FULL SCREEN
  </button>

</div>

  </div></div><!-- SOLD TEAM MODAL --><div id="soldModal" class="modal">  <div class="modal-box"><h2>Select Winning Team</h2>

<button class="team"
        onclick="confirmSold('VOLCANO VARANJOOR')">
  VOLCANO VARANJOOR
</button>

<button class="team"
        onclick="confirmSold('DRAGON BOOSTER')">
  DRAGON BOOSTER
</button>

<button class="team"
        onclick="confirmSold('RAJEEVIJI KALLIOT')">
  RAJEEVIJI KALLIOT
</button>

<button class="team"
        onclick="confirmSold('ACADEMY BOYS BANDHADUKA')">
  ACADEMY BOYS BANDHADUKA
</button>

<button class="cancel"
        onclick="closeSoldModal()">
  CANCEL
</button>

  </div></div><script>

const API_URL =
"https://script.google.com/macros/s/AKfycbx4_dUYrVPQEQjjWThl0q2vxYTt1SntdunMQbkN7LSV3t3JwiPhJgYTVkJQMJiI8PduSA/exec";

const PASSWORD = "KMPL@2026";

let players = [];

let currentIndex = 0;

let currentBid = 1000;

const BID_INCREMENT = 1000;


/* ==========================================
   GOOGLE DRIVE PHOTO URL CONVERTER
   ========================================== */

function getPhotoUrl(photo){

  if(!photo){
    return "";
  }

  photo = String(photo).trim();

  /* Already a data/image URL */
  if(photo.startsWith("data:image")){
    return photo;
  }

  /* Extract Google Drive FILE ID */

  let fileId = "";

  let match = photo.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);

  if(match){
    fileId = match[1];
  }

  if(!fileId){

    match = photo.match(/[?&]id=([a-zA-Z0-9_-]+)/);

    if(match){
      fileId = match[1];
    }

  }

  if(!fileId){

    match = photo.match(/\/d\/([a-zA-Z0-9_-]+)/);

    if(match){
      fileId = match[1];
    }

  }

  /* If Drive ID found */
  if(fileId){

    return "https://drive.google.com/thumbnail?id=" +
           fileId +
           "&sz=w1000";
  }

  /* If already another image URL */
  return photo;
}


/* ==========================================
   PHOTO ERROR
   ========================================== */

function photoError(){

  const photo =
    document.getElementById("playerPhoto");

  photo.onerror = null;

  photo.src =
    "https://via.placeholder.com/500x500?text=Photo+Not+Available";

}


/* ==========================================
   LOAD PLAYERS
   ========================================== */

async function loadPlayers(){

  try{

    const response = await fetch(
      API_URL +
      "?password=" +
      encodeURIComponent(PASSWORD)
    );

    const data = await response.json();

    if(!data.success){

      throw new Error(
        data.error || "Unable to load players"
      );

    }

    players = data.players || [];

    if(players.length === 0){

      document.getElementById("loading").innerText =
        "No players registered.";

      return;

    }

    document.getElementById("loading").style.display =
      "none";

    document.getElementById("auctionCard").style.display =
      "block";

    showPlayer();

  }catch(error){

    console.error(error);

    document.getElementById("loading").innerText =
      "Unable to load players. Please refresh.";

  }

}


/* ==========================================
   SHOW PLAYER
   ========================================== */

function showPlayer(){

  if(!players.length){
    return;
  }

  const player =
    players[currentIndex];


  document.getElementById("playerName").innerText =
    player.name || "-";


  document.getElementById("playerReg").innerText =
    player.registrationNumber || "";


  document.getElementById("playerPlace").innerText =
    player.place || "-";


  document.getElementById("playerRole").innerText =
    player.role || "-";


  document.getElementById("playerBatting").innerText =
    player.batting || "-";


  document.getElementById("playerBowling").innerText =
    player.bowling || "-";


  document.getElementById("playerTeam").innerText =
    player.team || "-";


  /* ======================================
     PLAYER PHOTO
     ====================================== */

  const photo =
    document.getElementById("playerPhoto");

  photo.onerror = photoError;

  const photoUrl =
    getPhotoUrl(player.photo);

  if(photoUrl){

    photo.src = photoUrl;

  }else{

    photo.src =
      "https://via.placeholder.com/500x500?text=No+Photo";

  }


  /* ======================================
     RESET BID
     ====================================== */

  currentBid = 1000;

  updateBidDisplay();


  /* ======================================
     AUCTION STATUS
     ====================================== */

  const status =
    document.getElementById("auctionStatus");


  if(player.auctionStatus === "SOLD"){

    status.innerText =
      "SOLD - ₹" +
      Number(player.soldPrice || 0)
        .toLocaleString("en-IN") +
      " - " +
      (player.soldTeam || "");

  }else if(player.auctionStatus === "UNSOLD"){

    status.innerText = "UNSOLD";

  }else{

    status.innerText = "";

  }

}


/* ==========================================
   BID DISPLAY
   ========================================== */

function updateBidDisplay(){

  document.getElementById("currentBid").innerText =
    "₹" +
    currentBid.toLocaleString("en-IN");

}


/* ==========================================
   PLUS ₹1,000
   ========================================== */

function increaseBid(){

  currentBid += BID_INCREMENT;

  updateBidDisplay();

}


/* ==========================================
   MINUS ₹1,000
   ========================================== */

function decreaseBid(){

  if(currentBid > 1000){

    currentBid -= BID_INCREMENT;

    updateBidDisplay();

  }else{

    alert("Bid cannot go below ₹1,000");

  }

}


/* ==========================================
   SOLD MODAL
   ========================================== */

function openSoldModal(){

  document.getElementById("soldModal").style.display =
    "flex";

}


function closeSoldModal(){

  document.getElementById("soldModal").style.display =
    "none";

}


/* ==========================================
   SOLD
   ========================================== */

async function confirmSold(teamName){

  closeSoldModal();

  const player =
    players[currentIndex];

  document.getElementById("auctionStatus").innerText =
    "Saving SOLD...";


  try{

    const response = await fetch(
      API_URL,
      {
        method:"POST",

        headers:{
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:JSON.stringify({

          action:"auction",

          registrationNumber:
            player.registrationNumber,

          status:"SOLD",

          soldPrice:
            currentBid,

          soldTeam:
            teamName

        })

      }
    );


    const result =
      await response.json();


    if(!result.success){

      throw new Error(
        result.error ||
        "Failed to save auction result"
      );

    }


    player.auctionStatus =
      "SOLD";

    player.soldPrice =
      currentBid;

    player.soldTeam =
      teamName;


    document.getElementById("auctionStatus").innerText =
      "SOLD - ₹" +
      currentBid.toLocaleString("en-IN") +
      " - " +
      teamName;


    alert(
      "SOLD successfully!\n\n" +
      player.name +
      "\n₹" +
      currentBid.toLocaleString("en-IN") +
      "\n" +
      teamName
    );


  }catch(error){

    console.error(error);

    document.getElementById("auctionStatus").innerText =
      "Error saving SOLD result";

    alert(
      "Unable to save auction result.\n\n" +
      error.message
    );

  }

}


/* ==========================================
   UNSOLD
   ========================================== */

async function markUnsold(){

  const player =
    players[currentIndex];


  if(!confirm(
    "Mark " +
    player.name +
    " as UNSOLD?"
  )){

    return;

  }


  document.getElementById("auctionStatus").innerText =
    "Saving UNSOLD...";


  try{

    const response = await fetch(
      API_URL,
      {

        method:"POST",

        headers:{
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:JSON.stringify({

          action:"auction",

          registrationNumber:
            player.registrationNumber,

          status:"UNSOLD",

          soldPrice:"",

          soldTeam:""

        })

      }
    );


    const result =
      await response.json();


    if(!result.success){

      throw new Error(
        result.error ||
        "Failed to save auction result"
      );

    }


    player.auctionStatus =
      "UNSOLD";

    player.soldPrice = "";

    player.soldTeam = "";


    document.getElementById("auctionStatus").innerText =
      "UNSOLD";


    alert(
      player.name +
      " marked as UNSOLD."
    );


  }catch(error){

    console.error(error);

    document.getElementById("auctionStatus").innerText =
      "Error saving UNSOLD result";

    alert(
      "Unable to save auction result.\n\n" +
      error.message
    );

  }

}


/* ==========================================
   NEXT PLAYER
   ========================================== */

function nextPlayer(){

  if(currentIndex < players.length - 1){

    currentIndex++;

    showPlayer();

  }else{

    alert("This is the last player.");

  }

}


/* ==========================================
   PREVIOUS PLAYER
   ========================================== */

function previousPlayer(){

  if(currentIndex > 0){

    currentIndex--;

    showPlayer();

  }else{

    alert("This is the first player.");

  }

}


/* ==========================================
   FULL SCREEN
   ========================================== */

function toggleFullscreen(){

  if(!document.fullscreenElement){

    document.documentElement
      .requestFullscreen()
      .catch(function(error){

        console.log(error);

      });

  }else{

    document.exitFullscreen();

  }

}


/* ==========================================
   START
   ========================================== */

loadPlayers();

</script></body>
</html>
