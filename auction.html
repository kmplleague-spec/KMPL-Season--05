<script>

// ======================================================
// API
// ======================================================

const API_URL =
"https://script.google.com/macros/s/AKfycbx4_dUYrVPQEQjjWThl0q2vxYTt1SntdunMQbkN7LSV3t3JwiPhJgYTVkJQMJiI8PduSA/exec";

const PASSWORD = "KMPL@2026";


// ======================================================
// VARIABLES
// ======================================================

let players = [];

let currentIndex = 0;

let currentBid = 1000;

const BID_INCREMENT = 1000;


// ======================================================
// LOAD PLAYERS
// ======================================================

async function loadPlayers() {

  try {

    const response = await fetch(
      API_URL +
      "?password=" +
      encodeURIComponent(PASSWORD)
    );

    const data = await response.json();

    if (!data.success) {

      throw new Error(
        data.error || "Unable to load players"
      );

    }

    players = data.players || [];

    if (players.length === 0) {

      document.getElementById("loading").innerText =
        "No players registered.";

      return;
    }

    document.getElementById("loading").style.display =
      "none";

    document.getElementById("auctionCard").style.display =
      "block";

    showPlayer();

  } catch (error) {

    console.error(error);

    document.getElementById("loading").innerText =
      "Unable to load players. Please refresh.";

  }

}


// ======================================================
// SHOW PLAYER
// ======================================================

function showPlayer() {

  if (
    !players.length ||
    currentIndex < 0 ||
    currentIndex >= players.length
  ) {
    return;
  }

  const player = players[currentIndex];


  // Player Name

  document.getElementById("playerName").innerText =
    player.name || "-";


  // Registration Number

  document.getElementById("playerReg").innerText =
    player.registrationNumber || "";


  // Place

  document.getElementById("playerPlace").innerText =
    player.place || "-";


  // Role

  document.getElementById("playerRole").innerText =
    player.role || "-";


  // Batting

  document.getElementById("playerBatting").innerText =
    player.batting || "-";


  // Bowling

  document.getElementById("playerBowling").innerText =
    player.bowling || "-";


  // Previous Team

  document.getElementById("playerTeam").innerText =
    player.team || "-";


  // Player Photo

  const photo =
    document.getElementById("playerPhoto");

  if (player.photo) {

    photo.src = player.photo;

  } else {

    photo.src =
      "https://via.placeholder.com/500x500?text=No+Photo";

  }


  // Reset Bid

  currentBid = 1000;

  updateBidDisplay();


  // Previous Auction Status

  const statusElement =
    document.getElementById("auctionStatus");


  if (player.auctionStatus) {

    if (player.auctionStatus === "SOLD") {

      statusElement.innerText =
        "SOLD - ₹" +
        Number(
          player.soldPrice || 0
        ).toLocaleString("en-IN") +
        " - " +
        (player.soldTeam || "");

    } else {

      statusElement.innerText =
        "UNSOLD";

    }

  } else {

    statusElement.innerText = "";

  }

}


// ======================================================
// UPDATE BID DISPLAY
// ======================================================

function updateBidDisplay() {

  document.getElementById("currentBid").innerText =
    "₹" +
    currentBid.toLocaleString("en-IN");

}


// ======================================================
// INCREASE BID
// ======================================================

function increaseBid() {

  currentBid += BID_INCREMENT;

  updateBidDisplay();

}


// ======================================================
// DECREASE BID
// ======================================================

function decreaseBid() {

  if (currentBid > 1000) {

    currentBid -= BID_INCREMENT;

    updateBidDisplay();

  } else {

    alert(
      "Bid cannot go below ₹1,000"
    );

  }

}


// ======================================================
// SOLD MODAL
// ======================================================

function openSoldModal() {

  if (!players.length) {
    return;
  }

  document.getElementById("soldModal").style.display =
    "flex";

}


function closeSoldModal() {

  document.getElementById("soldModal").style.display =
    "none";

}


// ======================================================
// CONFIRM SOLD
// ======================================================

async function confirmSold(teamName) {

  closeSoldModal();


  const player =
    players[currentIndex];


  const statusElement =
    document.getElementById("auctionStatus");


  statusElement.innerText =
    "Saving SOLD...";


  try {

    const response = await fetch(
      API_URL,
      {

        method: "POST",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body: JSON.stringify({

          action: "auction",

          registrationNumber:
            player.registrationNumber,

          status: "SOLD",

          soldPrice:
            currentBid,

          soldTeam:
            teamName

        })

      }
    );


    const result =
      await response.json();


    if (!result.success) {

      throw new Error(
        result.error ||
        "Failed to save auction result"
      );

    }


    // Update local data

    player.auctionStatus =
      "SOLD";

    player.soldPrice =
      currentBid;

    player.soldTeam =
      teamName;


    // Display SOLD

    statusElement.innerText =
      "SOLD - ₹" +
      currentBid.toLocaleString("en-IN") +
      " - " +
      teamName;


    alert(
      "SOLD successfully!\n\n" +
      player.name +
      "\n₹" +
      currentBid.toLocaleString("en-IN") +
      "\n" +
      teamName
    );


  } catch (error) {

    console.error(error);


    statusElement.innerText =
      "Error saving SOLD result";


    alert(
      "Unable to save auction result.\n\n" +
      error.message
    );

  }

}


// ======================================================
// UNSOLD
// ======================================================

async function markUnsold() {

  if (!players.length) {
    return;
  }


  const player =
    players[currentIndex];


  if (
    !confirm(
      "Mark " +
      player.name +
      " as UNSOLD?"
    )
  ) {

    return;

  }


  const statusElement =
    document.getElementById("auctionStatus");


  statusElement.innerText =
    "Saving UNSOLD...";


  try {

    const response = await fetch(
      API_URL,
      {

        method: "POST",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body: JSON.stringify({

          action: "auction",

          registrationNumber:
            player.registrationNumber,

          status: "UNSOLD",

          soldPrice: "",

          soldTeam: ""

        })

      }
    );


    const result =
      await response.json();


    if (!result.success) {

      throw new Error(
        result.error ||
        "Failed to save auction result"
      );

    }


    // Update local data

    player.auctionStatus =
      "UNSOLD";

    player.soldPrice =
      "";

    player.soldTeam =
      "";


    statusElement.innerText =
      "UNSOLD";


    alert(
      player.name +
      " marked as UNSOLD."
    );


  } catch (error) {

    console.error(error);


    statusElement.innerText =
      "Error saving UNSOLD result";


    alert(
      "Unable to save auction result.\n\n" +
      error.message
    );

  }

}


// ======================================================
// NEXT PLAYER
// ======================================================

function nextPlayer() {

  if (
    currentIndex <
    players.length - 1
  ) {

    currentIndex++;

    showPlayer();

  } else {

    alert(
      "This is the last player."
    );

  }

}


// ======================================================
// PREVIOUS PLAYER
// ======================================================

function previousPlayer() {

  if (currentIndex > 0) {

    currentIndex--;

    showPlayer();

  } else {

    alert(
      "This is the first player."
    );

  }

}


// ======================================================
// FULL SCREEN
// ======================================================

function toggleFullscreen() {

  if (!document.fullscreenElement) {

    document.documentElement
      .requestFullscreen()
      .catch(
        function(error) {

          console.log(error);

        }
      );

  } else {

    document.exitFullscreen();

  }

}


// ======================================================
// START AUCTION PAGE
// ======================================================

loadPlayers();

  </script>
