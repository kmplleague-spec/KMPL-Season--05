
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KMPL Season 05 - Player Auction</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:15px;
  background:#101010;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

.header{
  text-align:center;
  padding:15px 5px;
  border-bottom:2px solid #d4af37;
  margin-bottom:20px;
}

.header h1{
  color:#e5c45b;
  margin:5px 0;
  font-size:25px;
}

.header p{
  color:#bbb;
  margin:5px 0;
}

.container{
  max-width:1000px;
  margin:auto;
}

.status-bar{
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:15px;
  color:#ddd;
  font-size:14px;
}

.auction-card{
  background:#1d1d1d;
  border:2px solid #b99532;
  border-radius:16px;
  padding:18px;
  text-align:center;
}

.player-photo{
  width:230px;
  height:230px;
  object-fit:cover;
  border-radius:14px;
  border:3px solid #d4af37;
  background:#333;
}

.photo-fallback{
  display:none;
  width:230px;
  height:230px;
  border-radius:14px;
  border:3px solid #d4af37;
  background:#333;
  color:#e5c45b;
  align-items:center;
  justify-content:center;
  font-size:65px;
  margin:auto;
}

.photo-bid-area{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:13px;
  margin-bottom:18px;
}

.photo-bid-buttons{
  display:flex;
  justify-content:center;
  gap:12px;
  width:100%;
  max-width:380px;
}

.photo-bid-buttons button{
  flex:1;
  min-height:50px;
  border:0;
  border-radius:9px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.decrease-btn{
  background:#d58a37;
  color:#111;
}

.bid-btn{
  background:#e5c044;
  color:#111;
}

.photo-bid-buttons button:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.player-name{
  font-size:27px;
  color:#e5c45b;
  margin:8px 0;
  font-weight:bold;
}

.player-reg{
  color:#aaa;
  font-size:14px;
  margin-bottom:15px;
}

.player-details{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
  text-align:left;
  margin:18px 0;
}

.detail{
  background:#292929;
  padding:12px;
  border-radius:8px;
  overflow-wrap:anywhere;
}

.detail small{
  display:block;
  color:#aaa;
  margin-bottom:5px;
}

.detail strong{
  color:#fff;
  font-size:14px;
}

.bid-box{
  background:#292929;
  border:1px solid #a9872e;
  padding:15px;
  border-radius:12px;
  margin:15px 0;
}

.bid-label{
  color:#aaa;
  font-size:14px;
}

.current-bid{
  font-size:35px;
  font-weight:bold;
  color:#f1ce4b;
  margin-top:5px;
}

.buttons{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
  margin-top:15px;
}

button{
  border:0;
  border-radius:8px;
  padding:12px 18px;
  font-weight:bold;
  font-size:14px;
  cursor:pointer;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.sold-btn{
  background:#20a45b;
  color:white;
}

.unsold-btn{
  background:#d64040;
  color:white;
}

.next-btn{
  background:#e5c044;
  color:#111;
}

.normal-btn{
  background:#444;
  color:white;
}

.sync-btn{
  background:#256bb5;
  color:white;
}

.message{
  margin:15px 0;
  padding:12px;
  border-radius:8px;
  background:#292929;
  color:#ddd;
  text-align:center;
  display:none;
}

.message.error{
  color:#ff8d8d;
}

.message.success{
  color:#7ee5a0;
}

.loading{
  text-align:center;
  padding:30px;
  color:#e5c45b;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.88);
  z-index:1000;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modal-content{
  background:#222;
  border:2px solid #d4af37;
  border-radius:14px;
  padding:22px;
  width:100%;
  max-width:420px;
  text-align:center;
}

.modal-content h2{
  color:#e5c45b;
  margin-top:0;
}

.modal-content select{
  width:100%;
  padding:13px;
  margin:15px 0;
  background:#111;
  color:white;
  border:1px solid #777;
  border-radius:7px;
  font-size:16px;
}

.modal-buttons{
  display:flex;
  gap:10px;
}

.modal-buttons button{
  flex:1;
}

.confirm-btn{
  background:#20a45b;
  color:white;
}

.cancel-btn{
  background:#555;
  color:white;
}

.footer{
  text-align:center;
  color:#777;
  font-size:12px;
  margin:25px 0;
}

@media(max-width:500px){
  body{
    padding:9px;
  }

  .auction-card{
    padding:13px;
  }

  .player-photo,
  .photo-fallback{
    width:190px;
    height:190px;
  }

  .player-name{
    font-size:22px;
  }

  .player-details{
    grid-template-columns:1fr 1fr;
  }

  .photo-bid-buttons button{
    font-size:15px;
    padding:12px 5px;
  }

  .buttons button{
    flex:1 1 40%;
  }
}
</style>
</head>

<body>

<div class="header">
  <h1>KMPL SEASON 05</h1>
  <p>PLAYER AUCTION</p>
</div>

<div class="container">

  <div class="status-bar">
    <span id="playerCounter">Players: 0</span>
    <span id="roundLabel">FIRST ROUND</span>
  </div>

  <div id="messageBox" class="message"></div>

  <div id="loading" class="loading">
    Loading Players...
  </div>

  <div id="auctionArea" class="auction-card" style="display:none">

    <!-- PLAYER PHOTO AND BID BUTTONS -->
    <div class="photo-bid-area">

      <img
        id="playerPhoto"
        class="player-photo"
        src=""
        alt="Player Photo"
        onerror="photoError()"
      >

      <div id="photoFallback" class="photo-fallback">?</div>

      <div class="photo-bid-buttons">

        <button
          class="decrease-btn"
          id="decreaseBidButton"
          onclick="decreaseBid()"
          disabled>
          − ₹1,000
        </button>

        <button
          class="bid-btn"
          id="bidButton"
          onclick="increaseBid()"
          disabled>
          + ₹1,000
        </button>

      </div>

    </div>

    <div id="playerName" class="player-name">PLAYER NAME</div>

    <div id="playerReg" class="player-reg">KMPL000</div>

    <div class="player-details">

      <div class="detail">
        <small>PLACE</small>
        <strong id="playerPlace">-</strong>
      </div>

      <div class="detail">
        <small>PLAYING ROLE</small>
        <strong id="playerRole">-</strong>
      </div>

      <div class="detail">
        <small>BATTING STYLE</small>
        <strong id="playerBatting">-</strong>
      </div>

      <div class="detail">
        <small>BOWLING STYLE</small>
        <strong id="playerBowling">-</strong>
      </div>

      <div class="detail" style="grid-column:1/-1">
        <small>PREVIOUS TEAM</small>
        <strong id="playerPreviousTeam">-</strong>
      </div>

    </div>

    <div class="bid-box">
      <div class="bid-label">CURRENT BID</div>
      <div id="currentBid" class="current-bid">₹1,000</div>
    </div>

    <div class="buttons">

      <button class="sold-btn"
              id="soldButton"
              onclick="openSoldModal()">
        SOLD
      </button>

      <button class="unsold-btn"
              id="unsoldButton"
              onclick="markUnsold()">
        UNSOLD
      </button>

      <button class="normal-btn"
              onclick="previousPlayer()">
        PREVIOUS
      </button>

      <button class="next-btn"
              onclick="nextPlayer()">
        NEXT PLAYER
      </button>

    </div>

  </div>

  <div class="buttons">

    <button class="sync-btn" onclick="syncUnsoldPlayers()">
      SYNC UNSOLD PLAYERS
    </button>

    <button class="normal-btn" onclick="loadPlayers()">
      REFRESH PLAYERS
    </button>

    <button class="normal-btn" onclick="toggleFullscreen()">
      FULL SCREEN
    </button>

  </div>

</div>

<div class="footer">
  GOLDEN WINGS PRESENTS KMPL SEASON 05
</div>

<!-- SOLD TEAM MODAL -->
<div class="modal" id="soldModal">

  <div class="modal-content">

    <h2>PLAYER SOLD</h2>

    <p>Select Winning Team</p>

    <select id="teamSelect">
      <option value="">Select Team</option>
    </select>

    <div class="modal-buttons">

      <button class="confirm-btn" onclick="confirmSold()">
        CONFIRM SOLD
      </button>

      <button class="cancel-btn" onclick="closeSoldModal()">
        CANCEL
      </button>

    </div>

  </div>

</div>

<script>

/* =====================================
   KMPL SEASON 05 AUCTION SETTINGS
===================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbx4_dUYrVPQEQjjWThl0q2vxYTt1SntdunMQbkN7LSV3t3JwiPhJgYTVkJQMJiI8PduSA/exec";

const PASSWORD = "KMPL@2026";

const BASE_PRICE = 1000;
const BID_INCREMENT = 1000;

const TEAM_LIST = [
  "VOLCANO VARANJOOR",
  "SUPER STRIKERS ERUMAKULAM",
  "DRAGON BOOSTER",
  "CHAMPIONS ASAD",
  "RSA NILESHWARAM",
  "RAJEEVIJI KALLIOT",
  "WINDIES MARIKULAM",
  "KIWIS KASARAGOD",
  "ACADEMY BOYS BANDHADUKA",
  "FC CHEMBENCHERRY",
  "GMC THAIRA",
  "OPTICS PERIYA",
  "MARX KONNAKKAD",
  "KALLAI BROTHERS",
  "RAM BROTHERS PERIYA",
  "PENDING NAME"
];

/* =====================================
   AUCTION VARIABLES
===================================== */

let allPlayers = [];
let auctionPlayers = [];
let unsoldPlayers = [];

let currentIndex = 0;
let currentBid = BASE_PRICE;

let currentRound = 1;
let isSaving = false;

/* =====================================
   HELPER FUNCTIONS
===================================== */

function byId(id){
  return document.getElementById(id);
}

function showMessage(message,type=""){
  const box = byId("messageBox");

  box.textContent = message;
  box.className = "message " + type;
  box.style.display = "block";
}

function hideMessage(){
  byId("messageBox").style.display = "none";
}

function formatMoney(value){
  return "₹" + Number(value || 0).toLocaleString("en-IN");
}

function getRegNo(player){
  return player.registrationNumber ||
         player.regNo ||
         player.reg ||
         "";
}

function getStatus(player){
  return String(
    player.auctionStatus ||
    player.status ||
    "AVAILABLE"
  ).toUpperCase();
}

function getPlayerPhoto(player){
  return player.photoUrl ||
         player.photo ||
         player.imageUrl ||
         "";
}

/* =====================================
   RANDOM PLAYER ORDER
===================================== */

function shufflePlayers(players){

  const list = [...players];

  for(let i=list.length-1;i>0;i--){

    const j = Math.floor(Math.random()*(i+1));

    [list[i],list[j]] = [list[j],list[i]];

  }

  return list;
}

/* =====================================
   LOAD PLAYERS FROM GOOGLE SHEET
===================================== */

async function loadPlayers(){

  hideMessage();

  byId("loading").style.display = "block";
  byId("auctionArea").style.display = "none";

  try{

    const requestURL =
      API_URL +
      "?action=adminplayers" +
      "&password=" + encodeURIComponent(PASSWORD) +
      "&_=" + Date.now();

    const response = await fetch(requestURL,{
      method:"GET",
      cache:"no-store",
      redirect:"follow"
    });

    if(!response.ok){
      throw new Error("Server error: " + response.status);
    }

    const data = await response.json();

    if(!data.success){
      throw new Error(data.message || "Player loading failed");
    }

    if(!Array.isArray(data.players)){
      throw new Error("Players list not found in API response");
    }

    allPlayers = data.players;

    const availablePlayers = allPlayers.filter(player=>{
      const status = getStatus(player);

      return status !== "SOLD" &&
             status !== "UNSOLD";
    });

    unsoldPlayers = allPlayers.filter(player=>{
      return getStatus(player) === "UNSOLD";
    });

    auctionPlayers = shufflePlayers(availablePlayers);

    currentIndex = 0;
    currentRound = 1;

    byId("roundLabel").textContent = "FIRST ROUND";

    byId("loading").style.display = "none";

    if(auctionPlayers.length === 0){

      byId("auctionArea").style.display = "none";

      showMessage(
        "Available players ഇല്ല. UNSOLD Players Sync ചെയ്യുക.",
        "error"
      );

      updateCounter();

      return;
    }

    byId("auctionArea").style.display = "block";

    showPlayer();

    updateCounter();

    showMessage(
      auctionPlayers.length + " Players loaded successfully",
      "success"
    );

  }catch(error){

    byId("loading").style.display = "none";

    showMessage(
      "Unable to load players: " + error.message,
      "error"
    );

  }

}

/* =====================================
   SHOW PLAYER
===================================== */

function showPlayer(){

  if(!auctionPlayers.length){
    return;
  }

  if(currentIndex < 0){
    currentIndex = 0;
  }

  if(currentIndex >= auctionPlayers.length){
    currentIndex = auctionPlayers.length-1;
  }

  const player = auctionPlayers[currentIndex];

  currentBid = BASE_PRICE;

  byId("playerName").textContent =
    player.name || "Unknown Player";

  byId("playerReg").textContent =
    getRegNo(player);

  byId("playerPlace").textContent =
    player.place || "-";

  byId("playerRole").textContent =
    player.role || "-";

  byId("playerBatting").textContent =
    player.battingStyle ||
    player.batting ||
    "-";

  byId("playerBowling").textContent =
    player.bowlingStyle ||
    player.bowling ||
    "-";

  byId("playerPreviousTeam").textContent =
    player.previousTeam ||
    player.team ||
    "-";

  byId("currentBid").textContent =
    formatMoney(currentBid);

  const photo = getPlayerPhoto(player);

  byId("playerPhoto").style.display = "block";
  byId("photoFallback").style.display = "none";

  if(photo){

    byId("playerPhoto").src = photo;

  }else{

    photoError();

  }

  byId("bidButton").disabled = false;
  byId("soldButton").disabled = false;
  byId("unsoldButton").disabled = false;

  updateDecreaseButton();

  updateCounter();

}

/* =====================================
   PHOTO ERROR HANDLING
===================================== */

function photoError(){

  byId("playerPhoto").style.display = "none";
  byId("photoFallback").style.display = "flex";

}

/* =====================================
   BID INCREASE
===================================== */

function increaseBid(){

  if(!auctionPlayers.length || isSaving){
    return;
  }

  currentBid += BID_INCREMENT;

  byId("currentBid").textContent =
    formatMoney(currentBid);

  updateDecreaseButton();

}

/* =====================================
   BID DECREASE
===================================== */

function decreaseBid(){

  if(!auctionPlayers.length || isSaving){
    return;
  }

  if(currentBid <= BASE_PRICE){
    return;
  }

  currentBid -= BID_INCREMENT;

  if(currentBid < BASE_PRICE){
    currentBid = BASE_PRICE;
  }

  byId("currentBid").textContent =
    formatMoney(currentBid);

  updateDecreaseButton();

}

/* =====================================
   DECREASE BUTTON ENABLE / DISABLE
===================================== */

function updateDecreaseButton(){

  byId("decreaseBidButton").disabled =
    currentBid <= BASE_PRICE || isSaving;

}

/* =====================================
   LOAD TEAM LIST
===================================== */

function loadTeamOptions(){

  const select = byId("teamSelect");

  select.innerHTML =
    '<option value="">Select Team</option>';

  TEAM_LIST.forEach(team=>{

    const option = document.createElement("option");

    option.value = team;
    option.textContent = team;

    select.appendChild(option);

  });

}

/* =====================================
   SOLD MODAL
===================================== */

function openSoldModal(){

  if(!auctionPlayers.length){
    return;
  }

  loadTeamOptions();

  byId("soldModal").style.display = "flex";

}

function closeSoldModal(){

  byId("soldModal").style.display = "none";

}

/* =====================================
   SAVE AUCTION DATA
===================================== */

async function saveAuction(player,status,soldPrice=0,soldTeam=""){

  const registrationNumber = getRegNo(player);

  if(!registrationNumber){
    throw new Error("Player registration number missing");
  }

  const payload = {

    action:"auction",

    registrationNumber:registrationNumber,

    status:status,

    auctionStatus:status,

    soldPrice:Number(soldPrice),

    soldTeam:soldTeam,

    password:PASSWORD

  };

  const response = await fetch(API_URL,{

    method:"POST",

    redirect:"follow",

    headers:{
      "Content-Type":"text/plain;charset=utf-8"
    },

    body:JSON.stringify(payload)

  });

  const result = await response.json();

  if(!result.success){

    throw new Error(
      result.message || "Auction save failed"
    );

  }

  return result;

}

/* =====================================
   CONFIRM SOLD
===================================== */

async function confirmSold(){

  if(isSaving){
    return;
  }

  const team = byId("teamSelect").value;

  if(!team){

    alert("Please select a team");

    return;

  }

  const player = auctionPlayers[currentIndex];

  if(!player){
    return;
  }

  isSaving = true;

  updateButtons();

  try{

    await saveAuction(
      player,
      "SOLD",
      currentBid,
      team
    );

    player.auctionStatus = "SOLD";
    player.status = "SOLD";
    player.soldPrice = currentBid;
    player.soldTeam = team;

    closeSoldModal();

    showMessage(
      player.name + " SOLD to " + team +
      " for " + formatMoney(currentBid),
      "success"
    );

    nextPlayerAfterSave();

  }catch(error){

    showMessage(
      "SOLD Save Error: " + error.message,
      "error"
    );

  }finally{

    isSaving = false;

    updateButtons();

  }

}

/* =====================================
   MARK UNSOLD
===================================== */

async function markUnsold(){

  if(isSaving || !auctionPlayers.length){
    return;
  }

  const player = auctionPlayers[currentIndex];

  isSaving = true;

  updateButtons();

  try{

    await saveAuction(
      player,
      "UNSOLD",
      0,
      ""
    );

    player.auctionStatus = "UNSOLD";
    player.status = "UNSOLD";

    unsoldPlayers.push(player);

    showMessage(
      player.name + " marked as UNSOLD",
      "success"
    );

    nextPlayerAfterSave();

  }catch(error){

    showMessage(
      "UNSOLD Save Error: " + error.message,
      "error"
    );

  }finally{

    isSaving = false;

    updateButtons();

  }

}

/* =====================================
   NEXT PLAYER AFTER SAVE
===================================== */

function nextPlayerAfterSave(){

  auctionPlayers.splice(currentIndex,1);

  if(currentIndex >= auctionPlayers.length){
    currentIndex = 0;
  }

  if(auctionPlayers.length === 0){

    byId("auctionArea").style.display = "none";

    showMessage(
      "First Round Completed. UNSOLD Players ഉണ്ടെങ്കിൽ Sync ചെയ്യുക.",
      "success"
    );

    updateCounter();

    return;
  }

  showPlayer();

}

/* =====================================
   NEXT PLAYER
===================================== */

function nextPlayer(){

  if(!auctionPlayers.length){
    return;
  }

  if(currentIndex < auctionPlayers.length-1){
    currentIndex++;
  }else{
    currentIndex = 0;
  }

  showPlayer();

}

/* =====================================
   PREVIOUS PLAYER
===================================== */

function previousPlayer(){

  if(!auctionPlayers.length){
    return;
  }

  if(currentIndex > 0){
    currentIndex--;
  }else{
    currentIndex = auctionPlayers.length-1;
  }

  showPlayer();

}

/* =====================================
   SYNC UNSOLD PLAYERS
===================================== */

function syncUnsoldPlayers(){

  if(!unsoldPlayers.length){

    showMessage(
      "UNSOLD Players ഒന്നും ലഭ്യമല്ല.",
      "error"
    );

    return;

  }

  auctionPlayers = shufflePlayers(unsoldPlayers);

  unsoldPlayers = [];

  currentIndex = 0;
  currentRound = 2;

  byId("roundLabel").textContent =
    "UNSOLD ROUND";

  byId("auctionArea").style.display = "block";

  showPlayer();

  showMessage(
    auctionPlayers.length +
    " UNSOLD Players loaded for next round",
    "success"
  );

}

/* =====================================
   COUNTER
===================================== */

function updateCounter(){

  byId("playerCounter").textContent =
    "Remaining Players: " + auctionPlayers.length;

}

/* =====================================
   BUTTON STATES
===================================== */

function updateButtons(){

  byId("bidButton").disabled = isSaving;
  byId("soldButton").disabled = isSaving;
  byId("unsoldButton").disabled = isSaving;

  updateDecreaseButton();

}

/* =====================================
   FULL SCREEN
===================================== */

function toggleFullscreen(){

  if(!document.fullscreenElement){

    document.documentElement.requestFullscreen?.();

  }else{

    document.exitFullscreen?.();

  }

}

/* =====================================
   START AUCTION PAGE
===================================== */

document.addEventListener("DOMContentLoaded",()=>{

  loadTeamOptions();

  loadPlayers();

});

</script>

</body>
</html>
