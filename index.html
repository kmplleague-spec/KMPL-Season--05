
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>KMPL Season 05 – Registration</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:
    linear-gradient(
        135deg,
        #061426,
        #0b3d68,
        #061426
    );
    color:white;
    min-height:100vh;
}

.container{
    width:94%;
    max-width:650px;
    margin:auto;
    padding:20px 0;
}

.header{
    text-align:center;
    padding:20px 10px;
}

.header h1{
    margin:0;
    color:#ffd700;
    font-size:32px;
    font-weight:900;
}

.header h2{
    margin:8px 0;
    font-size:19px;
}

.header p{
    margin:5px 0;
    color:#d8e7f5;
}

.card{
    background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.2);
    border-radius:18px;
    padding:25px;
    box-shadow:
    0 10px 40px rgba(0,0,0,.35);
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:7px;
    font-weight:bold;
}

.required{
    color:#ff5555;
}

input,
select{
    width:100%;
    padding:13px;
    border-radius:10px;
    border:1px solid #aaa;
    font-size:15px;
    outline:none;
}

input:focus,
select:focus{
    border-color:#ffd700;
}

button{
    width:100%;
    border:0;
    border-radius:12px;
    padding:15px;
    margin-top:20px;
    font-size:17px;
    font-weight:900;
    cursor:pointer;
}

.submit-btn{
    background:#ffd700;
    color:#111;
}

.submit-btn:disabled{
    opacity:.6;
}

.whatsapp-btn{
    background:#25D366;
    color:white;
    margin-top:18px;
}

.error{
    display:none;
    margin-top:18px;
    padding:15px;
    border-radius:10px;
    background:rgba(255,0,0,.18);
    border:1px solid #ff5555;
}

.success{
    display:none;
    margin-top:20px;
    padding:25px 18px;
    border-radius:15px;
    text-align:center;
    background:rgba(0,180,80,.15);
    border:2px solid #25D366;
}

.success-title{
    color:#25D366;
    font-size:23px;
    font-weight:900;
    margin-bottom:20px;
}

.player-info{
    background:rgba(0,0,0,.20);
    padding:15px;
    border-radius:12px;
    margin-bottom:15px;
}

.player-info div{
    margin:8px 0;
}

.reg-number{
    color:#ffd700;
    font-size:28px;
    font-weight:900;
}

.join-text{
    margin-top:15px;
    font-size:15px;
    color:#e4eef7;
}

.footer{
    text-align:center;
    padding:20px 5px;
    font-size:13px;
    color:#b7c9da;
}

@media(max-width:500px){

    .header h1{
        font-size:26px;
    }

    .header h2{
        font-size:16px;
    }

    .card{
        padding:18px;
    }

}

</style>

</head>


<body>

<div class="container">


<div class="header">

<h1>🏏 KMPL SEASON 05</h1>

<h2>KIZHAKAN MEGALA PREMIER LEAGUE</h2>

<p>Player Registration</p>

</div>


<div class="card">


<form id="registrationForm">


<label>
Player Name <span class="required">*</span>
</label>

<input
type="text"
id="name"
placeholder="Enter player name"
required
>


<label>
Mobile Number <span class="required">*</span>
</label>

<input
type="tel"
id="mobile"
placeholder="Enter mobile number"
maxlength="15"
required
>


<label>
Place <span class="required">*</span>
</label>

<input
type="text"
id="place"
placeholder="Enter place"
required
>


<label>
Playing Role <span class="required">*</span>
</label>

<select id="role" required>

<option value="">
Select Playing Role
</option>

<option value="Batter">
Batter
</option>

<option value="Bowler">
Bowler
</option>

<option value="All Rounder">
All Rounder
</option>

<option value="Wicket Keeper">
Wicket Keeper
</option>

</select>


<label>
Batting Style <span class="required">*</span>
</label>

<select id="batting" required>

<option value="">
Select Batting Style
</option>

<option value="Right Hand">
Right Hand
</option>

<option value="Left Hand">
Left Hand
</option>

</select>


<label>
Bowling Style <span class="required">*</span>
</label>

<select id="bowling" required>

<option value="">
Select Bowling Style
</option>

<option value="Right Arm Fast">
Right Arm Fast
</option>

<option value="Right Arm Medium">
Right Arm Medium
</option>

<option value="Right Arm Spin">
Right Arm Spin
</option>

<option value="Left Arm Fast">
Left Arm Fast
</option>

<option value="Left Arm Medium">
Left Arm Medium
</option>

<option value="Left Arm Spin">
Left Arm Spin
</option>

<option value="None">
None
</option>

</select>


<label>
Previous Team
</label>

<input
type="text"
id="team"
placeholder="Enter previous team"
>


<label>
Player Photo <span class="required">*</span>
</label>

<input
type="file"
id="photo"
accept="image/*"
required
>


<button
type="submit"
id="submitBtn"
class="submit-btn"
>
REGISTER NOW
</button>


</form>


<div id="errorBox"
class="error">
</div>


<!-- =========================================
     SUCCESS BOX
========================================= -->

<div id="successBox"
class="success">

<div class="success-title">
✅ Registration Successful!
</div>


<div class="player-info">

<div>
<strong>Player Name:</strong>
<span id="successName"></span>
</div>


<div>
<strong>Registration No:</strong>
</div>

<div
id="successReg"
class="reg-number">
</div>

</div>


<div class="join-text">

Thank you for registering with KMPL. ❤️

<br><br>

Please join the official KMPL WhatsApp Group.

</div>


<button
type="button"
id="whatsappBtn"
class="whatsapp-btn"
>
📱 JOIN KMPL WHATSAPP GROUP
</button>


</div>


</div>


<div class="footer">

© KMPL Season 05<br>
Kizhakan Megala Premier League

</div>


</div>


<script>


// ======================================================
// APPS SCRIPT URL
// ======================================================

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbx4_dUYrVPQEQjjWThl0q2vxYTt1SntdunMQbkN7LSV3t3JwiPhJgYTVkJQMJiI8PduSA/exec";


// ======================================================
// WHATSAPP GROUP
// ======================================================

const KMPL_WHATSAPP_GROUP =
"https://chat.whatsapp.com/LcByyY2SQII2sK1ZJOsvVb";


// ======================================================
// ELEMENTS
// ======================================================

const form =
document.getElementById("registrationForm");

const submitBtn =
document.getElementById("submitBtn");

const errorBox =
document.getElementById("errorBox");

const successBox =
document.getElementById("successBox");

const successName =
document.getElementById("successName");

const successReg =
document.getElementById("successReg");

const whatsappBtn =
document.getElementById("whatsappBtn");


// ======================================================
// WHATSAPP BUTTON
// ======================================================

whatsappBtn.addEventListener(
"click",
function(){

    /*
      Direct WhatsApp group invite URL.
    */

    window.location.href =
    KMPL_WHATSAPP_GROUP;

});


// ======================================================
// FORM SUBMIT
// ======================================================

form.addEventListener(
"submit",
async function(e){

    e.preventDefault();


    errorBox.style.display =
    "none";

    successBox.style.display =
    "none";


    submitBtn.disabled =
    true;

    submitBtn.textContent =
    "REGISTERING...";


    const name =
    document
    .getElementById("name")
    .value
    .trim();


    const mobile =
    document
    .getElementById("mobile")
    .value
    .trim();


    const place =
    document
    .getElementById("place")
    .value
    .trim();


    const role =
    document
    .getElementById("role")
    .value;


    const batting =
    document
    .getElementById("batting")
    .value;


    const bowling =
    document
    .getElementById("bowling")
    .value;


    const team =
    document
    .getElementById("team")
    .value
    .trim();


    const photoInput =
    document
    .getElementById("photo");


    // ==================================================
    // VALIDATION
    // ==================================================

    if(
        !name ||
        !mobile ||
        !place ||
        !role ||
        !batting ||
        !bowling ||
        !photoInput.files.length
    ){

        showError(
        "Please fill all required fields."
        );

        resetButton();

        return;
    }


    const cleanMobile =
    mobile
    .replace(/\s+/g,"");


    if(
        !/^[0-9+]{10,15}$/
        .test(cleanMobile)
    ){

        showError(
        "Please enter a valid mobile number."
        );

        resetButton();

        return;
    }


    try{


        const file =
        photoInput.files[0];


        // ==================================================
        // IMAGE BASE64
        // ==================================================

        const base64 =
        await fileToBase64(file);


        // ==================================================
        // DATA
        // ==================================================

        const payload = {

            action:
            "register",

            name:
            name,

            mobile:
            cleanMobile,

            place:
            place,

            role:
            role,

            batting:
            batting,

            bowling:
            bowling,

            team:
            team,

            photo:
            file.name,

            photoData:
            base64,

            photoType:
            file.type

        };


        // ==================================================
        // SEND TO GOOGLE APPS SCRIPT
        // ==================================================

        const response =
        await fetch(
            SCRIPT_URL,
            {
                method:"POST",
                body:
                JSON.stringify(payload)
            }
        );


        const result =
        await response.json();


        // ==================================================
        // SUCCESS
        // ==================================================

        if(result.success){

            successName.textContent =
            result.name || name;


            successReg.textContent =
            result.registrationNumber || "";


            form.style.display =
            "none";


            successBox.style.display =
            "block";


            successBox.scrollIntoView({
                behavior:"smooth",
                block:"center"
            });


        }


        // ==================================================
        // DUPLICATE
        // ==================================================

        else if(result.duplicate){

            showError(
            "⚠️ This mobile number is already registered. Duplicate registration is not allowed."
            );

            resetButton();

        }


        // ==================================================
        // OTHER ERROR
        // ==================================================

        else{

            showError(
            result.error ||
            "Registration failed. Please try again."
            );

            resetButton();

        }


    }
    catch(error){

        console.error(error);

        showError(
        "Unable to connect to registration server. Please try again."
        );

        resetButton();

    }

});


// ======================================================
// FILE TO BASE64
// ======================================================

function fileToBase64(file){

    return new Promise(
    function(resolve,reject){

        const reader =
        new FileReader();


        reader.onload =
        function(){

            const result =
            reader.result;


            const base64 =
            result
            .split(",")[1];


            resolve(base64);

        };


        reader.onerror =
        function(){

            reject(
            new Error(
            "Unable to read image"
            )
            );

        };


        reader.readAsDataURL(file);

    });

}


// ======================================================
// ERROR
// ======================================================

function showError(message){

    errorBox.textContent =
    message;

    errorBox.style.display =
    "block";

    errorBox.scrollIntoView({
        behavior:"smooth",
        block:"center"
    });

}


// ======================================================
// RESET BUTTON
// ======================================================

function resetButton(){

    submitBtn.disabled =
    false;

    submitBtn.textContent =
    "REGISTER NOW";

}

</script>

</body>

</html>
