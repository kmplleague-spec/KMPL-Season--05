<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KMPL Season 05 – Player Registration</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(135deg,#071a2b,#0d3b66,#071a2b);
    color:#fff;
    min-height:100vh;
}

.container{
    width:95%;
    max-width:650px;
    margin:25px auto;
}

.header{
    text-align:center;
    padding:25px 15px;
}

.header h1{
    margin:0;
    font-size:32px;
    font-weight:800;
    color:#ffd700;
}

.header h2{
    margin:8px 0 0;
    font-size:20px;
}

.header p{
    margin:8px 0;
    color:#d7e6f5;
}

.card{
    background:rgba(255,255,255,0.10);
    border:1px solid rgba(255,255,255,0.20);
    border-radius:18px;
    padding:25px;
    box-shadow:0 10px 35px rgba(0,0,0,0.35);
    backdrop-filter:blur(10px);
}

label{
    display:block;
    margin:15px 0 7px;
    font-weight:700;
}

input,
select{
    width:100%;
    padding:13px;
    border-radius:10px;
    border:1px solid #aaa;
    font-size:15px;
    outline:none;
}

input:focus,
select:focus{
    border-color:#ffd700;
}

button{
    width:100%;
    border:0;
    border-radius:12px;
    padding:14px;
    font-size:17px;
    font-weight:800;
    cursor:pointer;
    margin-top:20px;
}

.submit-btn{
    background:#ffd700;
    color:#111;
}

.submit-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.whatsapp-btn{
    background:#25D366;
    color:#fff;
    margin-top:15px;
}

.success{
    display:none;
    margin-top:20px;
    padding:18px;
    border-radius:12px;
    background:rgba(0,180,80,.18);
    border:1px solid #25D366;
    text-align:center;
}

.success h3{
    margin:0 0 10px;
    color:#25D366;
}

.reg-number{
    font-size:24px;
    font-weight:900;
    color:#ffd700;
    margin:10px 0;
}

.error{
    display:none;
    margin-top:15px;
    padding:15px;
    border-radius:10px;
    background:rgba(255,0,0,.15);
    border:1px solid #ff5555;
    color:#fff;
}

.footer{
    text-align:center;
    padding:20px;
    color:#bcd0e3;
    font-size:13px;
}

.required{
    color:#ff6b6b;
}

.note{
    font-size:12px;
    color:#cbd9e6;
    margin-top:5px;
}

@media(max-width:500px){
    .header h1{
        font-size:25px;
    }

    .header h2{
        font-size:17px;
    }

    .card{
        padding:18px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>KMPL SEASON 05</h1>
        <h2>KIZHAKAN MEGALA PREMIER LEAGUE</h2>
        <p>Player Registration</p>
    </div>

    <div class="card">

        <form id="registrationForm">

            <label>
                Player Name <span class="required">*</span>
            </label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter player name"
                required
            >

            <label>
                Mobile Number <span class="required">*</span>
            </label>
            <input
                type="tel"
                id="mobile"
                name="mobile"
                placeholder="Enter mobile number"
                maxlength="15"
                required
            >
            <div class="note">
                One mobile number can register only once.
            </div>

            <label>
                Place <span class="required">*</span>
            </label>
            <input
                type="text"
                id="place"
                name="place"
                placeholder="Enter place"
                required
            >

            <label>
                Playing Role <span class="required">*</span>
            </label>
            <select id="role" name="role" required>
                <option value="">Select Playing Role</option>
                <option value="Batter">Batter</option>
                <option value="Bowler">Bowler</option>
                <option value="All Rounder">All Rounder</option>
                <option value="Wicket Keeper">Wicket Keeper</option>
            </select>

            <label>
                Batting Style <span class="required">*</span>
            </label>
            <select id="batting" name="batting" required>
                <option value="">Select Batting Style</option>
                <option value="Right Hand">Right Hand</option>
                <option value="Left Hand">Left Hand</option>
            </select>

            <label>
                Bowling Style <span class="required">*</span>
            </label>
            <select id="bowling" name="bowling" required>
                <option value="">Select Bowling Style</option>
                <option value="Right Arm Fast">Right Arm Fast</option>
                <option value="Right Arm Medium">Right Arm Medium</option>
                <option value="Right Arm Spin">Right Arm Spin</option>
                <option value="Left Arm Fast">Left Arm Fast</option>
                <option value="Left Arm Medium">Left Arm Medium</option>
                <option value="Left Arm Spin">Left Arm Spin</option>
                <option value="None">None</option>
            </select>

            <label>
                Previous Team
            </label>
            <input
                type="text"
                id="team"
                name="team"
                placeholder="Enter previous team (if any)"
            >

            <label>
                Player Photo <span class="required">*</span>
            </label>
            <input
                type="file"
                id="photo"
                name="photo"
                accept="image/*"
                required
            >

            <button
                type="submit"
                id="submitBtn"
                class="submit-btn"
            >
                REGISTER NOW
            </button>

        </form>

        <div id="errorBox" class="error"></div>

        <div id="successBox" class="success">

            <h3>✅ REGISTRATION SUCCESSFUL</h3>

            <div>Your Registration Number</div>

            <div
                id="regNumber"
                class="reg-number"
            ></div>

            <div>
                Please join the official KMPL WhatsApp Group.
            </div>

            <button
                type="button"
                id="whatsappBtn"
                class="whatsapp-btn"
            >
                📱 JOIN KMPL WHATSAPP GROUP
            </button>

        </div>

    </div>

    <div class="footer">
        © KMPL Season 05 – Kizhakan Megala Premier League
    </div>

</div>


<script>

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbx4_dUYrVPQEQjjWThl0q2vxYTt1SntdunMQbkN7LSV3t3JwiPhJgYTVkJQMJiI8PduSA/exec";


/*
  IMPORTANT:
  This is the official KMPL WhatsApp Group invite link.
*/
const KMPL_WHATSAPP_GROUP =
"https://chat.whatsapp.com/LcByyY2SQII2sK1ZJOsvVb";


const form =
document.getElementById("registrationForm");

const submitBtn =
document.getElementById("submitBtn");

const successBox =
document.getElementById("successBox");

const errorBox =
document.getElementById("errorBox");

const regNumber =
document.getElementById("regNumber");

const whatsappBtn =
document.getElementById("whatsappBtn");


/* WhatsApp Group Button */

whatsappBtn.addEventListener("click", function(){

    /*
      Directly open the WhatsApp group invite page.
    */

    window.location.href = KMPL_WHATSAPP_GROUP;

});


/* Registration */

form.addEventListener("submit", async function(e){

    e.preventDefault();

    errorBox.style.display = "none";
    errorBox.textContent = "";

    successBox.style.display = "none";

    submitBtn.disabled = true;
    submitBtn.textContent = "REGISTERING...";


    const name =
    document.getElementById("name").value.trim();

    const mobile =
    document.getElementById("mobile").value.trim();

    const place =
    document.getElementById("place").value.trim();

    const role =
    document.getElementById("role").value;

    const batting =
    document.getElementById("batting").value;

    const bowling =
    document.getElementById("bowling").value;

    const team =
    document.getElementById("team").value.trim();

    const photoInput =
    document.getElementById("photo");



    /* Basic validation */

    if(!name || !mobile || !place ||
       !role || !batting || !bowling ||
       !photoInput.files.length){

        showError(
            "Please fill all required fields and select a player photo."
        );

        submitBtn.disabled = false;
        submitBtn.textContent = "REGISTER NOW";

        return;
    }


    /* Mobile validation */

    const cleanMobile =
    mobile.replace(/\s+/g,"");

    if(!/^[0-9+]{10,15}$/.test(cleanMobile)){

        showError(
            "Please enter a valid mobile number."
        );

        submitBtn.disabled = false;
        submitBtn.textContent = "REGISTER NOW";

        return;
    }


    try{

        const file =
        photoInput.files[0];


        /*
          Convert image to Base64
        */

        const base64 =
        await fileToBase64(file);


        const payload = {

            action: "register",

            name: name,

            mobile: cleanMobile,

            place: place,

            role: role,

            batting: batting,

            bowling: bowling,

            team: team,

            photoBase64: base64,

            photoName: file.name,

            photoType: file.type

        };


        const response =
        await fetch(
            SCRIPT_URL,
            {
                method:"POST",
                body:JSON.stringify(payload)
            }
        );


        const result =
        await response.json();


        if(result.success){

            /*
              Show registration number
            */

            regNumber.textContent =
            result.registrationNumber || "SUCCESS";


            successBox.style.display =
            "block";


            /*
              Disable registration after successful
              registration.
            */

            form.style.display =
            "none";


            /*
              Scroll to success message
            */

            successBox.scrollIntoView({
                behavior:"smooth",
                block:"center"
            });


        }else{

            if(result.duplicate){

                showError(
                    "⚠️ This mobile number is already registered. Duplicate registration is not allowed."
                );

            }else{

                showError(
                    result.error ||
                    "Registration failed. Please try again."
                );

            }

            submitBtn.disabled = false;
            submitBtn.textContent = "REGISTER NOW";

        }

    }catch(error){

        console.error(error);

        showError(
            "Unable to connect to the registration server. Please check your internet connection and try again."
        );

        submitBtn.disabled = false;
        submitBtn.textContent = "REGISTER NOW";

    }

});


/* Convert image to Base64 */

function fileToBase64(file){

    return new Promise(function(resolve,reject){

        const reader =
        new FileReader();

        reader.onload =
        function(){

            const result =
            reader.result;

            /*
              Remove:
              data:image/jpeg;base64,
            */

            const base64 =
            result.split(",")[1];

            resolve(base64);

        };

        reader.onerror =
        function(){

            reject(
                new Error("Unable to read image")
            );

        };

        reader.readAsDataURL(file);

    });

}


/* Error message */

function showError(message){

    errorBox.textContent =
    message;

    errorBox.style.display =
    "block";

    errorBox.scrollIntoView({
        behavior:"smooth",
        block:"center"
    });

}

</script>

</body>
</html>
