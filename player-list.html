<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KMPL Season 05 - Player Cards</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #111;
    color: white;
}

.topbar {
    text-align: center;
    padding: 20px;
}

.topbar h1 {
    margin: 0;
    color: #ffd700;
    font-size: 28px;
}

.topbar p {
    margin: 6px 0 0;
    color: #ccc;
}

.controls {
    text-align: center;
    padding: 10px 15px 20px;
}

.controls button {
    padding: 12px 20px;
    margin: 5px;
    border: none;
    border-radius: 8px;
    background: #ffd700;
    color: #111;
    font-weight: bold;
    cursor: pointer;
}

#loading {
    text-align: center;
    padding: 35px 15px;
    font-size: 18px;
}

.player-card {
    width: 210mm;
    min-height: 297mm;
    margin: 20px auto;
    padding: 18mm;
    background: linear-gradient(145deg, #071426, #0d3d68, #071426);
    border: 5px solid #ffd700;
    border-radius: 10px;
    position: relative;
    overflow: hidden;
    page-break-after: always;
}

.card-header {
    position: relative;
    z-index: 2;
    text-align: center;
}

.card-header h1 {
    margin: 0;
    color: #ffd700;
    font-size: 30px;
    font-weight: 900;
}

.card-header h2 {
    margin: 7px 0 0;
    font-size: 18px;
}

.card-header p {
    margin: 6px 0 18px;
    color: #d8e7f5;
}

.photo-wrap {
    position: relative;
    z-index: 2;
    width: 145mm;
    height: 115mm;
    margin: 0 auto 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.photo-wrap img {
    display: block;
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    border: 5px solid #ffd700;
    border-radius: 15px;
    background: #222;
    box-shadow: 0 8px 30px rgba(0,0,0,.5);
}

.photo-fallback {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    border: 2px dashed #ffd700;
    border-radius: 15px;
    color: #ddd;
    text-align: center;
    background: rgba(0,0,0,.2);
}

.photo-fallback .person {
    font-size: 65px;
}

.photo-fallback small {
    color: #ffd700;
    font-size: 13px;
}

.player-name {
    position: relative;
    z-index: 2;
    text-align: center;
    font-size: 30px;
    font-weight: 900;
    text-transform: uppercase;
    overflow-wrap: anywhere;
    margin: 10px 0 18px;
}

.registration {
    position: relative;
    z-index: 2;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    color: #ffd700;
    margin-bottom: 20px;
}

.details {
    position: relative;
    z-index: 2;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.detail {
    background: rgba(255,255,255,.09);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 10px;
    padding: 13px;
    min-height: 62px;
}

.detail-label {
    font-size: 12px;
    color: #b9cde0;
    text-transform: uppercase;
    margin-bottom: 5px;
}

.detail-value {
    font-size: 17px;
    font-weight: 800;
    overflow-wrap: anywhere;
}

.card-footer {
    position: absolute;
    bottom: 10mm;
    left: 0;
    right: 0;
    text-align: center;
    color: #b8c9d8;
    font-size: 12px;
}

@media print {
    @page {
        size: A4;
        margin: 0;
    }

    body {
        background: white;
    }

    .topbar,
    .controls,
    #loading {
        display: none !important;
    }

    .player-card {
        width: 210mm;
        height: 297mm;
        min-height: 297mm;
        margin: 0;
        border-radius: 0;
        page-break-after: always;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
    }
}

@media screen and (max-width: 700px) {
    .player-card {
        width: 95%;
        min-height: auto;
        padding: 25px;
        margin: 15px auto;
    }

    .photo-wrap {
        width: 100%;
        height: 350px;
    }

    .details {
        grid-template-columns: 1fr;
    }

    .card-footer {
        position: static;
        margin-top: 25px;
    }
}
</style>
</head>

<body>

<div class="topbar">
    <h1>🏏 KMPL SEASON 05</h1>
    <p>KIZHAKAN MEGALA PREMIER LEAGUE</p>
</div>

<div class="controls">
    <button onclick="loadPlayers()">🔄 REFRESH PLAYERS</button>
    <button onclick="window.print()">🖨️ PRINT / SAVE AS PDF</button>
</div>

<div id="loading">Loading Players...</div>
<div id="playersContainer"></div>

<script>
"use strict";

// =============================================
// APPS SCRIPT CONFIGURATION
// =============================================

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbx4_dUYrVPQEQjjWThl0q2vxYTt1SntdunMQbkN7LSV3t3JwiPhJgYTVkJQMJiI8PduSA/exec";

const ADMIN_PASSWORD = "KMPL@2026";

// =============================================
// LOAD PLAYERS
// =============================================

async function loadPlayers() {
    const loading = document.getElementById("loading");
    const container = document.getElementById("playersContainer");

    loading.style.display = "block";
    loading.textContent = "Loading Players...";
    container.innerHTML = "";

    try {
        const apiUrl =
            SCRIPT_URL +
            "?password=" +
            encodeURIComponent(ADMIN_PASSWORD);

        const response = await fetch(apiUrl, {
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error("HTTP error: " + response.status);
        }

        const data = await response.json();

        if (!data.success) {
            throw new Error(data.error || data.message || "API error");
        }

        const players = Array.isArray(data.players)
            ? data.players
            : [];

        if (players.length === 0) {
            loading.textContent = "No players found.";
            return;
        }

        loading.style.display = "none";
        renderPlayers(players);

    } catch (error) {
        console.error("KMPL API error:", error);
        loading.textContent =
            "Players could not be loaded. Check Apps Script deployment and access.";
    }
}

// =============================================
// FIELD HELPERS
// =============================================

function getField(player, keys) {
    for (const key of keys) {
        const value = player[key];

        if (
            value !== undefined &&
            value !== null &&
            String(value).trim() !== ""
        ) {
            return String(value).trim();
        }
    }

    return "";
}

function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function makeDetail(label, value) {
    return `
        <div class="detail">
            <div class="detail-label">${escapeHtml(label)}</div>
            <div class="detail-value">${escapeHtml(value || "-")}</div>
        </div>
    `;
}

// =============================================
// RENDER PLAYER CARDS
// =============================================

function renderPlayers(players) {
    const container = document.getElementById("playersContainer");
    container.innerHTML = "";

    players.forEach(function(player) {
        const name = getField(player, ["name", "Name", "C"]);
        const registration = getField(player, [
            "registrationNumber",
            "registration_number",
            "Registration Number",
            "B"
        ]);

        const mobile = getField(player, ["mobile", "Mobile", "D"]);
        const place = getField(player, ["place", "Place", "E"]);
        const role = getField(player, ["role", "Role", "F"]);
        const batting = getField(player, ["batting", "Batting", "G"]);
        const bowling = getField(player, ["bowling", "Bowling", "H"]);
        const team = getField(player, [
            "team", "previousTeam", "previous_team",
            "Previous Team", "I"
        ]);

        const photoValue = getField(player, [
            "photo", "photoUrl", "photoURL", "photo_url",
            "image", "imageUrl", "imageURL",
            "playerPhoto", "Player Photo", "Photo", "J"
        ]);

        const card = document.createElement("section");
        card.className = "player-card";

        card.innerHTML = `
            <div class="card-header">
                <h1>KMPL SEASON 05</h1>
                <h2>KIZHAKAN MEGALA PREMIER LEAGUE</h2>
                <p>OFFICIAL PLAYER CARD</p>
            </div>

            <div class="photo-wrap">
                <div class="photo-fallback">
                    <div class="person">👤</div>
                    <div>PLAYER PHOTO</div>
                    <small>Loading photo...</small>
                </div>
            </div>

            <div class="player-name">${escapeHtml(name || "-")}</div>

            <div class="registration">
                REGISTRATION NO: ${escapeHtml(registration || "-")}
            </div>

            <div class="details">
                ${makeDetail("Mobile Number", "📱 " + (mobile || "-"))}
                ${makeDetail("Place", "📍 " + (place || "-"))}
                ${makeDetail("Playing Role", "🏏 " + (role || "-"))}
                ${makeDetail("Batting Style", batting)}
                ${makeDetail("Bowling Style", bowling)}
                ${makeDetail("Previous Team", team)}
            </div>

            <div class="card-footer">
                KMPL SEASON 05 • OFFICIAL PLAYER CARD
            </div>
        `;

        container.appendChild(card);

        const photoWrap = card.querySelector(".photo-wrap");
        loadPlayerPhoto(photoValue, photoWrap);
    });
}

// =============================================
// EXTRACT GOOGLE DRIVE FILE ID
// =============================================

function extractDriveId(value) {
    if (!value) return "";

    const input = String(value).trim();

    if (/^[a-zA-Z0-9_-]{25,}$/.test(input)) {
        return input;
    }

    const patterns = [
        /\/file\/d\/([a-zA-Z0-9_-]+)/i,
        /\/thumbnail\?[^#]*\bid=([a-zA-Z0-9_-]+)/i,
        /\/uc\?[^#]*\bid=([a-zA-Z0-9_-]+)/i,
        /\/open\?[^#]*\bid=([a-zA-Z0-9_-]+)/i,
        /[?&]id=([a-zA-Z0-9_-]{25,})/i
    ];

    for (const pattern of patterns) {
        const match = input.match(pattern);
        if (match && match[1]) return match[1];
    }

    return "";
}

// =============================================
// BUILD PHOTO URL CANDIDATES
// =============================================

function getPhotoCandidates(value) {
    if (!value) return [];

    const input = String(value).trim();
    const fileId = extractDriveId(input);

    if (!fileId) {
        return /^https?:\/\//i.test(input) ? [input] : [];
    }

    return [
        "https://drive.google.com/thumbnail?id=" +
            encodeURIComponent(fileId) + "&sz=w1000",

        "https://drive.google.com/uc?export=view&id=" +
            encodeURIComponent(fileId),

        "https://drive.google.com/uc?id=" +
            encodeURIComponent(fileId),

        "https://lh3.googleusercontent.com/d/" +
            encodeURIComponent(fileId)
    ];
}

// =============================================
// LOAD PHOTO
// =============================================

function loadPlayerPhoto(value, photoWrap) {
    const candidates = getPhotoCandidates(value);
    const fallback = photoWrap.querySelector(".photo-fallback");

    if (candidates.length === 0) {
        if (fallback) {
            fallback.querySelector("small").textContent =
                "Photo URL missing in API";
        }

        console.warn("Photo URL missing:", value);
        return;
    }

    const img = document.createElement("img");
    img.alt = "Player Photo";
    img.style.display = "none";

    let currentIndex = 0;

    img.onload = function() {
        if (fallback) fallback.remove();

        img.style.display = "block";

        console.log("Player photo loaded:", candidates[currentIndex]);
    };

    img.onerror = function() {
        currentIndex++;

        if (currentIndex < candidates.length) {
            img.src = candidates[currentIndex];
        } else {
            img.remove();

            if (fallback) {
                fallback.querySelector("small").textContent =
                    "Photo could not be loaded";
            }

            console.error(
                "All photo URLs failed:",
                candidates
            );
        }
    };

    photoWrap.appendChild(img);
    img.src = candidates[currentIndex];
}

// =============================================
// START
// =============================================

loadPlayers();
</script>

</body>
</html>
