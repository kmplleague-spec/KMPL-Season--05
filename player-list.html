<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KMPL Season 05 - Player List</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#111;
  color:#fff;
}

.topbar{
  position:sticky;
  top:0;
  z-index:100;
  background:#111;
  padding:15px;
  text-align:center;
  border-bottom:2px solid #333;
}

.topbar h1{
  margin:0 0 8px;
  font-size:25px;
}

.topbar p{
  margin:0 0 12px;
  color:#bbb;
}

button{
  border:0;
  border-radius:10px;
  padding:12px 20px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  margin:4px;
}

.printBtn{
  background:#f5b400;
  color:#000;
}

.refreshBtn{
  background:#333;
  color:#fff;
}

#count{
  margin-top:8px;
  color:#aaa;
}

#loading{
  text-align:center;
  padding:40px;
  font-size:20px;
}

#cards{
  padding:20px;
}

/* =========================
   PLAYER CARD / PDF PAGE
========================= */

.player-card{
  width:210mm;
  min-height:297mm;
  margin:0 auto 25px;
  padding:16mm;
  position:relative;
  overflow:hidden;

  background:
    radial-gradient(circle at top right,#ffdd55 0,#ffdd5500 32%),
    radial-gradient(circle at bottom left,#00d4ff 0,#00d4ff00 35%),
    linear-gradient(135deg,#15156b,#7b1fa2,#e91e63);

  border-radius:18px;
  box-shadow:0 10px 35px #000;
  page-break-after:always;
  break-after:page;
}

.player-card:before{
  content:"";
  position:absolute;
  width:240px;
  height:240px;
  border-radius:50%;
  border:25px solid #ffffff22;
  top:-80px;
  left:-80px;
}

.player-card:after{
  content:"";
  position:absolute;
  width:300px;
  height:300px;
  border-radius:50%;
  border:35px solid #ffffff18;
  right:-130px;
  bottom:-130px;
}

/* HEADER */

.card-header{
  position:relative;
  z-index:2;
  text-align:center;
  margin-bottom:15px;
}

.logo-title{
  font-size:30px;
  font-weight:900;
  letter-spacing:2px;
}

.season{
  font-size:16px;
  font-weight:bold;
  margin-top:5px;
  letter-spacing:3px;
}

/* PHOTO */

.photo-wrap{
  position:relative;
  z-index:2;
  width:105mm;
  height:110mm;
  margin:10px auto 15px;
  border-radius:22px;
  padding:5px;

  background:
    linear-gradient(135deg,#fff,#ffd740,#00e5ff,#ff4081);
}

.photo-inner{
  width:100%;
  height:100%;
  border-radius:18px;
  overflow:hidden;
  background:#222;
  display:flex;
  align-items:center;
  justify-content:center;
}

.photo-inner img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.no-photo{
  color:#aaa;
  font-size:18px;
}

/* NAME */

.player-name{
  position:relative;
  z-index:2;
  text-align:center;
  font-size:32px;
  font-weight:900;
  text-transform:uppercase;
  margin:8px 0;
  text-shadow:0 3px 10px #000;
}

.reg{
  position:relative;
  z-index:2;
  text-align:center;
  font-size:17px;
  font-weight:bold;
  color:#fff;
  margin-bottom:15px;
}

/* DETAILS */

.details{
  position:relative;
  z-index:2;
  background:#00000066;
  border:1px solid #ffffff44;
  border-radius:18px;
  padding:15px;
}

.detail-row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:10px 4px;
  border-bottom:1px solid #ffffff25;
  font-size:16px;
}

.detail-row:last-child{
  border-bottom:0;
}

.label{
  font-weight:bold;
  color:#ffe082;
}

.value{
  text-align:right;
  font-weight:bold;
}

/* FOOTER */

.card-footer{
  position:absolute;
  bottom:9mm;
  left:0;
  width:100%;
  text-align:center;
  z-index:2;
  font-size:13px;
  font-weight:bold;
  letter-spacing:2px;
  opacity:.9;
}

/* ERROR */

.error{
  text-align:center;
  padding:30px;
  color:#ff7777;
}

/* =========================
   PRINT
========================= */

@media print{

  @page{
    size:A4;
    margin:0;
  }

  body{
    background:#fff;
  }

  .topbar{
    display:none !important;
  }

  #cards{
    padding:0;
  }

  .player-card{
    width:210mm;
    height:297mm;
    min-height:297mm;
    margin:0;
    border-radius:0;
    box-shadow:none;

    -webkit-print-color-adjust:exact;
    print-color-adjust:exact;
  }
}

/* MOBILE PREVIEW */

@media(max-width:700px){

  .player-card{
    width:100%;
    min-height:auto;
    padding:25px 18px 70px;
    border-radius:14px;
  }

  .photo-wrap{
    width:75%;
    height:300px;
  }

  .player-name{
    font-size:25px;
  }

  .detail-row{
    font-size:14px;
  }
}
</style>
</head>

<body>

<div class="topbar">

  <h1>🏏 KMPL SEASON 05</h1>

  <p>PLAYER CARD LIST</p>

  <button class="printBtn" onclick="printPDF()">
    📄 PRINT / SAVE PDF
  </button>

  <button class="refreshBtn" onclick="loadPlayers()">
    🔄 REFRESH
  </button>

  <div id="count">
    Loading players...
  </div>

</div>

<div id="loading">
  ⏳ Loading Player Cards...
</div>

<div id="cards"></div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbx4_dUYrVPQEQjjWThl0q2vxYTt1SntdunMQbkN7LSV3t3JwiPhJgYTVkJQMJiI8PduSA/exec";

const ADMIN_PASSWORD = "KMPL@2026";

let players = [];


/* =========================
   LOAD PLAYERS
========================= */

async function loadPlayers(){

  document.getElementById("loading").style.display =
    "block";

  document.getElementById("cards").innerHTML = "";

  try{

    const response = await fetch(
      API_URL +
      "?password=" +
      encodeURIComponent(ADMIN_PASSWORD)
    );

    const result = await response.json();

    if(!result.success){

      document.getElementById("loading").innerHTML =
        "❌ Unable to load players.";

      return;
    }

    players = result.players || [];

    document.getElementById("loading").style.display =
      "none";

    document.getElementById("count").textContent =
      "Total Players: " + players.length;

    renderCards();

  }catch(error){

    console.error(error);

    document.getElementById("loading").innerHTML =
      "❌ Error loading player data.";

  }

}


/* =========================
   RENDER CARDS
========================= */

function renderCards(){

  const container =
    document.getElementById("cards");

  container.innerHTML = "";

  players.forEach(function(player,index){

    const card =
      document.createElement("div");

    card.className = "player-card";

    card.innerHTML = `

      <div class="card-header">

        <div class="logo-title">
          🏏 KMPL
        </div>

        <div class="season">
          KIZHAKAN MEGALA PREMIER LEAGUE
        </div>

        <div class="season">
          SEASON 05
        </div>

      </div>


      <div class="photo-wrap">

        <div class="photo-inner">

          <img
            id="photo-${index}"
            src=""
            alt="Player Photo"
            onerror="photoError(${index})"
          >

          <div
            id="no-photo-${index}"
            class="no-photo"
            style="display:none;"
          >
            No Photo
          </div>

        </div>

      </div>


      <div class="player-name">
        ${escapeHtml(player.playerName || "PLAYER")}
      </div>

      <div class="reg">
        REGISTRATION NO:
        ${escapeHtml(player.registrationNumber || "-")}
      </div>


      <div class="details">

        <div class="detail-row">
          <span class="label">📍 Place</span>
          <span class="value">
            ${escapeHtml(player.place || "-")}
          </span>
        </div>

        <div class="detail-row">
          <span class="label">🏏 Playing Role</span>
          <span class="value">
            ${escapeHtml(player.playingRole || "-")}
          </span>
        </div>

        <div class="detail-row">
          <span class="label">🏏 Batting Style</span>
          <span class="value">
            ${escapeHtml(player.battingStyle || "-")}
          </span>
        </div>

        <div class="detail-row">
          <span class="label">🎯 Bowling Style</span>
          <span class="value">
            ${escapeHtml(player.bowlingStyle || "-")}
          </span>
        </div>

        <div class="detail-row">
          <span class="label">👕 Previous Team</span>
          <span class="value">
            ${escapeHtml(player.previousTeam || "-")}
          </span>
        </div>

      </div>


      <div class="card-footer">
        KMPL SEASON 05 • PLAYER AUCTION
      </div>

    `;

    container.appendChild(card);

    setPhoto(player.photo,index);

  });

}


/* =========================
   DRIVE PHOTO
========================= */

function setPhoto(photo,index){

  const img =
    document.getElementById("photo-"+index);

  const noPhoto =
    document.getElementById("no-photo-"+index);

  if(!photo){

    img.style.display = "none";
    noPhoto.style.display = "block";

    return;
  }

  let url =
    String(photo).trim();

  let fileId = "";

  let match =
    url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);

  if(match){
    fileId = match[1];
  }

  if(!fileId){

    match =
      url.match(/[?&]id=([a-zA-Z0-9_-]+)/);

    if(match){
      fileId = match[1];
    }

  }

  if(!fileId){

    match =
      url.match(/\/d\/([a-zA-Z0-9_-]+)/);

    if(match){
      fileId = match[1];
    }

  }

  if(fileId){

    url =
      "https://drive.google.com/thumbnail?id=" +
      fileId +
      "&sz=w1000";

  }

  img.src = url;

}


/* =========================
   PHOTO ERROR
========================= */

function photoError(index){

  const img =
    document.getElementById("photo-"+index);

  const noPhoto =
    document.getElementById("no-photo-"+index);

  img.style.display = "none";
  noPhoto.style.display = "block";

}


/* =========================
   PRINT / SAVE PDF
========================= */

function printPDF(){

  if(players.length === 0){

    alert("No players available.");
    return;

  }

  window.print();

}


/* =========================
   SECURITY / HTML ESCAPE
========================= */

function escapeHtml(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   START
========================= */

loadPlayers();

</script>

</body>
</html>
