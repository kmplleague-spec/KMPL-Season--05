<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KMPL Season 05 – Player Cards</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#111;
    color:#fff;
}

.topbar{
    text-align:center;
    padding:20px;
    background:#111;
}

.topbar h1{
    margin:0;
    color:#ffd700;
    font-size:28px;
}

.topbar p{
    margin:6px 0 0;
    color:#ccc;
}

.controls{
    text-align:center;
    padding:10px 15px 20px;
}

.controls button{
    padding:12px 20px;
    border:0;
    border-radius:8px;
    background:#ffd700;
    color:#111;
    font-weight:bold;
    cursor:pointer;
}


/* ======================================================
   A4 PLAYER CARD
====================================================== */

.player-card{
    width:210mm;
    min-height:297mm;
    margin:20px auto;
    padding:18mm;

    background:
        linear-gradient(
            145deg,
            #071426,
            #0d3d68,
            #071426
        );

    border:5px solid #ffd700;
    border-radius:10px;

    position:relative;

    overflow:hidden;

    page-break-after:always;
}


/* Decorative circle */

.player-card::before{
    content:"";
    position:absolute;
    width:250px;
    height:250px;
    border-radius:50%;
    border:30px solid rgba(255,215,0,.08);
    right:-100px;
    top:-80px;
}

.player-card::after{
    content:"";
    position:absolute;
    width:220px;
    height:220px;
    border-radius:50%;
    border:25px solid rgba(255,255,255,.04);
    left:-100px;
    bottom:-80px;
}


/* Header */

.card-header{
    position:relative;
    z-index:2;
    text-align:center;
}

.card-header h1{
    margin:0;
    color:#ffd700;
    font-size:30px;
    font-weight:900;
}

.card-header h2{
    margin:7px 0 0;
    font-size:18px;
}

.card-header p{
    margin:6px 0 18px;
    color:#d8e7f5;
}


/* Photo */

.photo-wrap{
    position:relative;
    z-index:2;

    width:145mm;
    height:115mm;

    margin:0 auto 20px;

    display:flex;
    justify-content:center;
    align-items:center;
}

.photo-wrap img{
    max-width:100%;
    max-height:100%;

    object-fit:contain;

    border-radius:15px;

    border:5px solid #ffd700;

    box-shadow:
        0 8px 30px rgba(0,0,0,.5);

    background:#222;
}


/* Player name */

.player-name{
    position:relative;
    z-index:2;

    text-align:center;

    color:#fff;

    font-size:30px;
    font-weight:900;

    text-transform:uppercase;

    margin:10px 0 18px;
}


/* Registration number */

.registration{
    position:relative;
    z-index:2;

    text-align:center;

    font-size:18px;
    font-weight:bold;

    color:#ffd700;

    margin-bottom:20px;
}


/* Details */

.details{
    position:relative;
    z-index:2;

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:12px;

    margin-top:10px;
}

.detail{
    background:rgba(255,255,255,.09);

    border:1px solid rgba(255,255,255,.15);

    border-radius:10px;

    padding:13px;

    min-height:62px;
}

.detail-label{
    font-size:12px;

    color:#b9cde0;

    text-transform:uppercase;

    margin-bottom:5px;
}

.detail-value{
    font-size:17px;

    font-weight:800;

    color:#fff;

    word-break:break-word;
}


/* Footer */

.card-footer{
    position:absolute;

    bottom:10mm;

    left:0;
    right:0;

    text-align:center;

    color:#b8c9d8;

    font-size:12px;

    z-index:2;
}


/* ======================================================
   LOADING
====================================================== */

#loading{
    text-align:center;
    padding:50px;
    font-size:20px;
}


/* ======================================================
   PRINT
====================================================== */

@media print{

    @page{
        size:A4;
        margin:0;
    }

    body{
        background:#fff;
    }

    .topbar,
    .controls,
    #loading{
        display:none !important;
    }

    .player-card{
        margin:0;
        width:210mm;
        height:297mm;
        min-height:297mm;

        border-radius:0;

        page-break-after:always;

        -webkit-print-color-adjust:exact;
        print-color-adjust:exact;
    }

}


/* ======================================================
   MOBILE PREVIEW
====================================================== */

@media screen and (max-width:700px){

    .player-card{
        width:95%;
        min-height:auto;

        padding:25px;

        margin:15px auto;
    }

    .photo-wrap{
        width:100%;
        height:350px;
    }

    .details{
        grid-template-columns:1fr;
    }

    .card-footer{
        position:static;
        margin-top:25px;
    }

}
</style>

</head>


<body>


<div class="topbar">

    <h1>🏏 KMPL SEASON 05</h1>

    <p>
        KIZHAKAN MEGALA PREMIER LEAGUE
    </p>

</div>


<div class="controls">

    <button onclick="window.print()">
        🖨️ PRINT / SAVE AS PDF
    </button>

</div>


<div id="loading">
    Loading Players...
</div>


<div id="playersContainer"></div>


<script>


// ======================================================
// APPS SCRIPT URL
// ======================================================

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbx4_dUYrVPQEQjjWThl0q2vxYTt1SntdunMQbkN7LSV3t3JwiPhJgYTVkJQMJiI8PduSA/exec";


// ======================================================
// ADMIN PASSWORD
// ======================================================

const ADMIN_PASSWORD =
"KMPL@2026";


// ======================================================
// LOAD PLAYERS
// ======================================================

async function loadPlayers(){

    try{

        const response =
        await fetch(
            SCRIPT_URL +
            "?password=" +
            encodeURIComponent(
                ADMIN_PASSWORD
            )
        );


        const data =
        await response.json();


        if(!data.success){

            document.getElementById(
                "loading"
            ).textContent =
            "Unable to load players.";

            return;
        }


        const players =
        data.players || [];


        document.getElementById(
            "loading"
        ).style.display =
        "none";


        renderPlayers(players);


    }
    catch(error){

        console.error(error);

        document.getElementById(
            "loading"
        ).textContent =
        "Error loading players.";

    }

}


// ======================================================
// RENDER PLAYERS
// ======================================================

function renderPlayers(players){

    const container =
    document.getElementById(
        "playersContainer"
    );


    container.innerHTML = "";


    players.forEach(function(player){

        const card =
        document.createElement("div");

        card.className =
        "player-card";


        const photo =
        getPhotoUrl(
            player.photo
        );


        card.innerHTML = `

            <div class="card-header">

                <h1>
                    KMPL SEASON 05
                </h1>

                <h2>
                    KIZHAKAN MEGALA PREMIER LEAGUE
                </h2>

                <p>
                    OFFICIAL PLAYER CARD
                </p>

            </div>


            <div class="photo-wrap">

                ${
                    photo
                    ?
                    `<img
                        src="${photo}"
                        alt="Player Photo"
                        onerror="this.style.display='none'"
                    >`
                    :
                    `<div
                        style="
                        font-size:70px;
                        color:#777;
                        "
                    >
                        👤
                    </div>`
                }

            </div>


            <div class="player-name">

                ${escapeHtml(
                    player.name || "-"
                )}

            </div>


            <div class="registration">

                REGISTRATION NO:
                ${escapeHtml(
                    player.registrationNumber || "-"
                )}

            </div>


            <div class="details">


                <div class="detail">

                    <div class="detail-label">
                        Mobile Number
                    </div>

                    <div class="detail-value">
                        📱 ${
                            escapeHtml(
                                player.mobile || "-"
                            )
                        }
                    </div>

                </div>


                <div class="detail">

                    <div class="detail-label">
                        Place
                    </div>

                    <div class="detail-value">
                        📍 ${
                            escapeHtml(
                                player.place || "-"
                            )
                        }
                    </div>

                </div>


                <div class="detail">

                    <div class="detail-label">
                        Playing Role
                    </div>

                    <div class="detail-value">
                        🏏 ${
                            escapeHtml(
                                player.role || "-"
                            )
                        }
                    </div>

                </div>


                <div class="detail">

                    <div class="detail-label">
                        Batting Style
                    </div>

                    <div class="detail-value">
                        ${
                            escapeHtml(
                                player.batting || "-"
                            )
                        }
                    </div>

                </div>


                <div class="detail">

                    <div class="detail-label">
                        Bowling Style
                    </div>

                    <div class="detail-value">
                        ${
                            escapeHtml(
                                player.bowling || "-"
                            )
                        }
                    </div>

                </div>


                <div class="detail">

                    <div class="detail-label">
                        Previous Team
                    </div>

                    <div class="detail-value">
                        ${
                            escapeHtml(
                                player.team || "-"
                            )
                        }
                    </div>

                </div>


            </div>


            <div class="card-footer">

                KMPL SEASON 05
                • OFFICIAL PLAYER CARD

            </div>

        `;


        container.appendChild(card);

    });

}


// ======================================================
// GOOGLE DRIVE PHOTO
// ======================================================

function getPhotoUrl(url){

    if(!url){
        return "";
    }


    const match =
    String(url).match(
        /[-\w]{25,}/
    );


    if(match){

        return (
            "https://drive.google.com/thumbnail?id=" +
            match[0] +
            "&sz=w1000"
        );

    }


    return url;

}


// ======================================================
// ESCAPE HTML
// ======================================================

function escapeHtml(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


// ======================================================
// START
// ======================================================

loadPlayers();

</script>


</body>
</html>
