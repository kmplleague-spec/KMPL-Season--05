<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KMPL Season 05 - Admin Panel</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f4f6;
  color:#111827;
}

.header{
  background:#111827;
  color:white;
  padding:20px;
  text-align:center;
}

.container{
  max-width:1200px;
  margin:20px auto;
  padding:0 15px;
}

.login,.dashboard{
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

input,button{
  padding:11px 14px;
  border-radius:7px;
  border:1px solid #d1d5db;
  font-size:14px;
}

button{
  cursor:pointer;
  border:none;
}

.login button{
  background:#111827;
  color:white;
}

.stats{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:12px;
  margin-bottom:20px;
}

.stat{
  background:white;
  padding:18px;
  border-radius:10px;
  text-align:center;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.stat strong{
  display:block;
  font-size:26px;
  margin-top:5px;
}

.toolbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

.toolbar input{
  flex:1;
  min-width:220px;
}

.refresh{background:#2563eb;color:white}
.csv{background:#059669;color:white}
.print{background:#7c3aed;color:white}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:950px;
}

th,td{
  padding:11px;
  border-bottom:1px solid #e5e7eb;
  text-align:left;
  font-size:13px;
}

th{
  background:#f9fafb;
}

.photo{
  width:55px;
  height:55px;
  object-fit:cover;
  border-radius:8px;
}

.edit{
  background:#f59e0b;
  color:white;
  margin-right:5px;
}

.delete{
  background:#dc2626;
  color:white;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modal-box{
  background:white;
  width:100%;
  max-width:500px;
  padding:22px;
  border-radius:12px;
}

.modal-box h2{
  margin-top:0;
}

.form-group{
  margin-bottom:12px;
}

.form-group label{
  display:block;
  font-size:13px;
  margin-bottom:5px;
  font-weight:bold;
}

.form-group input,
.form-group select{
  width:100%;
  box-sizing:border-box;
  padding:10px;
}

.save{
  background:#059669;
  color:white;
}

.cancel{
  background:#6b7280;
  color:white;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:15px;
}

#app{
  display:none;
}

@media(max-width:700px){
  .stats{
    grid-template-columns:repeat(2,1fr);
  }
}
</style>
</head>

<body>

<div class="header">
  <h1>KMPL Season 05</h1>
  <p>Admin Panel</p>
</div>

<div class="container">

<div class="login" id="loginBox">
  <h2>Admin Login</h2>
  <input type="password" id="password" placeholder="Enter Password">
  <button onclick="login()">LOGIN</button>
  <p id="loginMsg"></p>
</div>

<div id="app">

<div class="stats">
  <div class="stat">Total<strong id="total">0</strong></div>
  <div class="stat">Batsman<strong id="batsman">0</strong></div>
  <div class="stat">Bowler<strong id="bowler">0</strong></div>
  <div class="stat">All-Rounder<strong id="allrounder">0</strong></div>
  <div class="stat">Wicket Keeper<strong id="keeper">0</strong></div>
</div>

<div class="dashboard">

<div class="toolbar">
  <input
    type="text"
    id="search"
    placeholder="Search name, registration number, mobile, place..."
    oninput="filterPlayers()">

  <button class="refresh" onclick="loadPlayers()">REFRESH</button>
  <button class="csv" onclick="downloadCSV()">DOWNLOAD CSV</button>
  <button class="print" onclick="window.print()">PRINT</button>
</div>

<div class="table-wrap">
<table id="playerTable">
<thead>
<tr>
<th>Photo</th>
<th>Reg. No</th>
<th>Name</th>
<th>Mobile</th>
<th>Place</th>
<th>Role</th>
<th>Batting</th>
<th>Bowling</th>
<th>Previous Team</th>
<th>Action</th>
</tr>
</thead>

<tbody id="playerBody"></tbody>
</table>
</div>

</div>
</div>
</div>

<!-- EDIT MODAL -->

<div class="modal" id="editModal">
<div class="modal-box">

<h2>Edit Player</h2>

<input type="hidden" id="editReg">

<div class="form-group">
<label>Player Name</label>
<input id="editName">
</div>

<div class="form-group">
<label>Mobile Number</label>
<input id="editMobile">
</div>

<div class="form-group">
<label>Place</label>
<input id="editPlace">
</div>

<div class="form-group">
<label>Playing Role</label>
<select id="editRole">
<option value="">Select Role</option>
<option>Batsman</option>
<option>Bowler</option>
<option>All-Rounder</option>
<option>Wicket Keeper</option>
</select>
</div>

<div class="form-group">
<label>Batting Style</label>
<input id="editBatting">
</div>

<div class="form-group">
<label>Bowling Style</label>
<input id="editBowling">
</div>

<div class="form-group">
<label>Previous Team</label>
<input id="editTeam">
</div>

<div class="actions">
<button class="save" onclick="saveEdit()">SAVE CHANGES</button>
<button class="cancel" onclick="closeModal()">CANCEL</button>
</div>

</div>
</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbx4_dUYrVPQEQjjWThl0q2vxYTt1SntdunMQbkN7LSV3t3JwiPhJgYTVkJQMJiI8PduSA/exec";

const ADMIN_PASSWORD = "KMPL@2026";

let players = [];

function login(){

  const password =
    document.getElementById("password").value;

  if(password !== ADMIN_PASSWORD){
    document.getElementById("loginMsg").innerText =
      "Wrong password";
    return;
  }

  document.getElementById("loginBox").style.display="none";
  document.getElementById("app").style.display="block";

  loadPlayers();
}

async function loadPlayers(){

  try{

    const response =
      await fetch(API_URL + "?password=" +
      encodeURIComponent(ADMIN_PASSWORD));

    const data = await response.json();

    if(!data.success){
      alert("Unable to load players");
      return;
    }

    players = data.players || [];

    updateStats();
    displayPlayers(players);

  }catch(error){

    alert("Error loading players");

  }
}

function updateStats(){

  document.getElementById("total").innerText =
    players.length;

  document.getElementById("batsman").innerText =
    players.filter(p =>
      String(p.role).toLowerCase().includes("batsman")
    ).length;

  document.getElementById("bowler").innerText =
    players.filter(p =>
      String(p.role).toLowerCase() === "bowler"
    ).length;

  document.getElementById("allrounder").innerText =
    players.filter(p =>
      String(p.role).toLowerCase().includes("all")
    ).length;

  document.getElementById("keeper").innerText =
    players.filter(p =>
      String(p.role).toLowerCase().includes("keeper")
    ).length;
}

function displayPlayers(list){

  const body =
    document.getElementById("playerBody");

  body.innerHTML="";

  list.forEach(player => {

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>
        ${
          player.photo
          ? `<a href="${player.photo}" target="_blank">
               <img class="photo" src="${player.photo}">
             </a>`
          : "No Photo"
        }
      </td>

      <td>${escapeHTML(player.registrationNumber)}</td>
      <td>${escapeHTML(player.name)}</td>
      <td>${escapeHTML(player.mobile)}</td>
      <td>${escapeHTML(player.place)}</td>
      <td>${escapeHTML(player.role)}</td>
      <td>${escapeHTML(player.batting)}</td>
      <td>${escapeHTML(player.bowling)}</td>
      <td>${escapeHTML(player.team)}</td>

      <td>
        <button class="edit"
          onclick="openEdit('${escapeJS(player.registrationNumber)}')">
          ✏️ EDIT
        </button>

        <button class="delete"
          onclick="deletePlayer('${escapeJS(player.registrationNumber)}')">
          🗑️ DELETE
        </button>
      </td>
    `;

    body.appendChild(tr);
  });
}

function filterPlayers(){

  const q =
    document.getElementById("search")
    .value
    .toLowerCase();

  const filtered =
    players.filter(p => {

      return Object.values(p)
        .join(" ")
        .toLowerCase()
        .includes(q);

    });

  displayPlayers(filtered);
}

function openEdit(reg){

  const player =
    players.find(p =>
      String(p.registrationNumber) === String(reg)
    );

  if(!player){
    alert("Player not found");
    return;
  }

  document.getElementById("editReg").value =
    player.registrationNumber;

  document.getElementById("editName").value =
    player.name || "";

  document.getElementById("editMobile").value =
    player.mobile || "";

  document.getElementById("editPlace").value =
    player.place || "";

  document.getElementById("editRole").value =
    player.role || "";

  document.getElementById("editBatting").value =
    player.batting || "";

  document.getElementById("editBowling").value =
    player.bowling || "";

  document.getElementById("editTeam").value =
    player.team || "";

  document.getElementById("editModal").style.display =
    "flex";
}

function closeModal(){

  document.getElementById("editModal").style.display =
    "none";
}

async function saveEdit(){

  const data = {

    registrationNumber:
      document.getElementById("editReg").value,

    name:
      document.getElementById("editName").value,

    mobile:
      document.getElementById("editMobile").value,

    place:
      document.getElementById("editPlace").value,

    role:
      document.getElementById("editRole").value,

    batting:
      document.getElementById("editBatting").value,

    bowling:
      document.getElementById("editBowling").value,

    team:
      document.getElementById("editTeam").value
  };

  try{

    const response =
      await fetch(API_URL,{
        method:"POST",
        body:JSON.stringify({
          action:"update",
          ...data
        })
      });

    const result =
      await response.json();

    if(result.success){

      alert("Player updated successfully");

      closeModal();
      loadPlayers();

    }else{

      alert(result.error || "Update failed");

    }

  }catch(error){

    alert("Update error");

  }
}

async function deletePlayer(reg){

  const player =
    players.find(p =>
      String(p.registrationNumber) === String(reg)
    );

  if(!player) return;

  const confirmDelete =
    confirm(
      "Delete " + player.name +
      " (" + player.registrationNumber + ")?"
    );

  if(!confirmDelete) return;

  try{

    const response =
      await fetch(API_URL,{
        method:"POST",
        body:JSON.stringify({
          action:"delete",
          registrationNumber:reg
        })
      });

    const result =
      await response.json();

    if(result.success){

      alert("Player deleted successfully");
      loadPlayers();

    }else{

      alert(result.error || "Delete failed");

    }

  }catch(error){

    alert("Delete error");

  }
}

function downloadCSV(){

  if(!players.length){
    alert("No players available");
    return;
  }

  const headers = [
    "Registration Number",
    "Name",
    "Mobile",
    "Place",
    "Role",
    "Batting",
    "Bowling",
    "Previous Team",
    "Photo"
  ];

  const rows =
    players.map(p => [
      p.registrationNumber,
      p.name,
      p.mobile,
      p.place,
      p.role,
      p.batting,
      p.bowling,
      p.team,
      p.photo
    ]);

  const csv = [
    headers,
    ...rows
  ]
  .map(row =>
    row.map(value =>
      `"${String(value || "").replace(/"/g,'""')}"`
    ).join(",")
  )
  .join("\n");

  const blob =
    new Blob([csv],{
      type:"text/csv;charset=utf-8;"
    });

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href=url;
  a.download="KMPL_Season_05_Players.csv";
  a.click();

  URL.revokeObjectURL(url);
}

function escapeHTML(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function escapeJS(value){

  return String(value || "")
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'");
}

</script>

</body>
</html>
