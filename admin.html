<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>KMPL Season 05 - Admin Panel</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
background:#f2f4f7;
padding:15px;
}

.container{
max-width:1200px;
margin:auto;
}

.login-box,
.admin-box{
background:#fff;
border-radius:18px;
padding:25px;
box-shadow:0 8px 30px rgba(0,0,0,.12);
}

.login-box{
max-width:450px;
margin:60px auto;
text-align:center;
}

.login-box h1,
.admin-box h1{
color:#064e3b;
margin-bottom:8px;
}

.subtitle{
color:#666;
margin-bottom:25px;
}

input,
select{
width:100%;
padding:13px;
border:1px solid #ccc;
border-radius:9px;
font-size:15px;
}

.login-box input{
margin-bottom:15px;
}

button{
border:0;
border-radius:9px;
padding:12px 16px;
background:#16a34a;
color:#fff;
font-size:14px;
font-weight:bold;
cursor:pointer;
}

button:hover{
opacity:.9;
}

.logout{
background:#dc2626;
float:right;
}

.dashboard{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:12px;
margin:20px 0;
}

.card{
background:#ecfdf5;
padding:18px;
border-radius:12px;
text-align:center;
}

.card-title{
font-size:13px;
color:#666;
}

.card-number{
font-size:28px;
font-weight:bold;
color:#064e3b;
margin-top:6px;
}

.controls{
display:flex;
gap:10px;
margin:20px 0;
flex-wrap:wrap;
}

.search{
flex:1;
min-width:250px;
}

.download{
background:#2563eb;
}

.print{
background:#7c3aed;
}

.refresh{
background:#16a34a;
}

.table-wrap{
overflow-x:auto;
}

table{
width:100%;
border-collapse:collapse;
background:#fff;
}

th,
td{
padding:11px;
border-bottom:1px solid #ddd;
text-align:left;
white-space:nowrap;
}

th{
background:#064e3b;
color:#fff;
}

.photo{
width:55px;
height:55px;
object-fit:cover;
border-radius:8px;
}

.view-btn{
background:#2563eb;
padding:7px 10px;
font-size:12px;
}

.empty{
text-align:center;
padding:30px;
color:#777;
}

.error{
color:#dc2626;
margin-top:10px;
font-weight:bold;
}

@media(max-width:800px){

.dashboard{
grid-template-columns:repeat(2,1fr);
}

.controls{
flex-direction:column;
}

.search{
width:100%;
}

}

@media print{

body{
background:#fff;
padding:0;
}

.login-box,
.controls,
.logout,
.dashboard,
.subtitle{
display:none !important;
}

.admin-box{
box-shadow:none;
padding:0;
}

table{
font-size:10px;
}

th,
td{
padding:5px;
}

}

</style>

</head>


<body>


<!-- LOGIN -->

<div class="login-box" id="loginBox">

<h1>🏏 KMPL</h1>

<div class="subtitle">
Season 05 Admin Panel
</div>

<input
type="password"
id="password"
placeholder="Enter Admin Password"
>

<button onclick="login()">
LOGIN
</button>

<div
class="error"
id="loginError">
</div>

</div>



<!-- ADMIN PANEL -->

<div
class="container"
id="adminPanel"
style="display:none;">


<div class="admin-box">


<button
class="logout"
onclick="logout()">
LOGOUT
</button>


<h1>
🏏 KMPL Season 05
</h1>

<div class="subtitle">
Player Registration Dashboard
</div>



<!-- DASHBOARD -->

<div class="dashboard">


<div class="card">

<div class="card-title">
TOTAL PLAYERS
</div>

<div
class="card-number"
id="totalPlayers">
0
</div>

</div>


<div class="card">

<div class="card-title">
BATSMAN
</div>

<div
class="card-number"
id="batsmanCount">
0
</div>

</div>


<div class="card">

<div class="card-title">
BOWLER
</div>

<div
class="card-number"
id="bowlerCount">
0
</div>

</div>


<div class="card">

<div class="card-title">
ALL-ROUNDER
</div>

<div
class="card-number"
id="allRounderCount">
0
</div>

</div>


<div class="card">

<div class="card-title">
WICKET KEEPER
</div>

<div
class="card-number"
id="keeperCount">
0
</div>

</div>


</div>



<!-- CONTROLS -->

<div class="controls">


<input
class="search"
type="text"
id="search"
placeholder="🔎 Search name, registration no, mobile, place..."
onkeyup="filterPlayers()"
>


<button
class="refresh"
onclick="loadPlayers()">
🔄 REFRESH
</button>


<button
class="download"
onclick="downloadCSV()">
📥 DOWNLOAD CSV
</button>


<button
class="print"
onclick="window.print()">
🖨️ PRINT
</button>


</div>



<!-- TABLE -->

<div class="table-wrap">

<table>

<thead>

<tr>

<th>Photo</th>

<th>Reg. No</th>

<th>Player Name</th>

<th>Mobile</th>

<th>Place</th>

<th>Role</th>

<th>Batting</th>

<th>Bowling</th>

<th>Previous Team</th>

<th>Photo</th>

</tr>

</thead>


<tbody id="playerTable">

<tr>

<td
colspan="10"
class="empty">

Loading...

</td>

</tr>

</tbody>

</table>

</div>


</div>

</div>



<script>


const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbx4_dUYrVPQEQjjWThl0q2vxYTt1SntdunMQbkN7LSV3t3JwiPhJgYTVkJQMJiI8PduSA/exec";


const ADMIN_PASSWORD =
"KMPL@2026";


let players = [];

let displayedPlayers = [];


// --------------------------------
// LOGIN
// --------------------------------

function login(){

const password =
document.getElementById("password").value;

const error =
document.getElementById("loginError");


if(password === ADMIN_PASSWORD){

document.getElementById("loginBox")
.style.display = "none";

document.getElementById("adminPanel")
.style.display = "block";

loadPlayers();

}else{

error.innerText =
"❌ Incorrect password";

}

}


// --------------------------------
// LOGOUT
// --------------------------------

function logout(){

document.getElementById("adminPanel")
.style.display = "none";

document.getElementById("loginBox")
.style.display = "block";

document.getElementById("password").value = "";

}


// --------------------------------
// LOAD PLAYERS
// --------------------------------

async function loadPlayers(){

const table =
document.getElementById("playerTable");

table.innerHTML =
'<tr><td colspan="10" class="empty">Loading...</td></tr>';


try{

const response =
await fetch(
SCRIPT_URL +
"?password=" +
encodeURIComponent(ADMIN_PASSWORD)
);


const data =
await response.json();


if(!data.success){

throw new Error(
data.error || "Unable to load data"
);

}


players =
data.players || [];

displayedPlayers =
players.slice();


updateDashboard();

displayPlayers(displayedPlayers);


}catch(error){

table.innerHTML =
'<tr><td colspan="10" class="empty">❌ Failed to load players</td></tr>';

}

}


// --------------------------------
// DASHBOARD COUNTS
// --------------------------------

function updateDashboard(){

document.getElementById("totalPlayers")
.innerText = players.length;


document.getElementById("batsmanCount")
.innerText =
players.filter(p =>
p.role === "Batsman"
).length;


document.getElementById("bowlerCount")
.innerText =
players.filter(p =>
p.role === "Bowler"
).length;


document.getElementById("allRounderCount")
.innerText =
players.filter(p =>
p.role === "All-Rounder"
).length;


document.getElementById("keeperCount")
.innerText =
players.filter(p =>
p.role === "Wicket Keeper"
).length;

}


// --------------------------------
// DISPLAY PLAYERS
// --------------------------------

function displayPlayers(list){

const table =
document.getElementById("playerTable");


if(list.length === 0){

table.innerHTML =
'<tr><td colspan="10" class="empty">No registrations found</td></tr>';

return;

}


table.innerHTML = "";


list.forEach(function(player){


const row =
document.createElement("tr");


let photoHTML = "No Photo";

if(player.photo){

photoHTML =
'<img src="' +
escapeHTML(player.photo) +
'" class="photo">';

}


let viewHTML = "-";

if(player.photo){

viewHTML =
'<a href="' +
escapeHTML(player.photo) +
'" target="_blank">' +
'<button class="view-btn">VIEW</button>' +
'</a>';

}


row.innerHTML = `

<td>${photoHTML}</td>

<td>
<strong>
${escapeHTML(player.registrationNumber)}
</strong>
</td>

<td>
${escapeHTML(player.name)}
</td>

<td>
${escapeHTML(player.mobile)}
</td>

<td>
${escapeHTML(player.place)}
</td>

<td>
${escapeHTML(player.role)}
</td>

<td>
${escapeHTML(player.batting)}
</td>

<td>
${escapeHTML(player.bowling)}
</td>

<td>
${escapeHTML(player.team)}
</td>

<td>
${viewHTML}
</td>

`;


table.appendChild(row);

});

}


// --------------------------------
// SEARCH
// --------------------------------

function filterPlayers(){

const search =
document.getElementById("search")
.value
.toLowerCase()
.trim();


if(!search){

displayedPlayers =
players.slice();

displayPlayers(displayedPlayers);

return;

}


displayedPlayers =
players.filter(function(player){

return (

String(player.registrationNumber)
.toLowerCase()
.includes(search)

||

String(player.name)
.toLowerCase()
.includes(search)

||

String(player.mobile)
.toLowerCase()
.includes(search)

||

String(player.place)
.toLowerCase()
.includes(search)

||

String(player.role)
.toLowerCase()
.includes(search)

);

});


displayPlayers(displayedPlayers);

}


// --------------------------------
// CSV DOWNLOAD
// --------------------------------

function downloadCSV(){

if(players.length === 0){

alert("No player data available.");

return;

}


let csv = "";


csv +=
"Registration Number,Player Name,Mobile,Place,Playing Role,Batting Style,Bowling Style,Previous Team,Photo\n";


players.forEach(function(player){

csv += [

csvEscape(player.registrationNumber),

csvEscape(player.name),

csvEscape(player.mobile),

csvEscape(player.place),

csvEscape(player.role),

csvEscape(player.batting),

csvEscape(player.bowling),

csvEscape(player.team),

csvEscape(player.photo)

].join(",") + "\n";

});


const blob =
new Blob(
[csv],
{
type:"text/csv;charset=utf-8;"
}
);


const url =
URL.createObjectURL(blob);


const link =
document.createElement("a");

link.href = url;

link.download =
"KMPL_Season_05_Player_List.csv";

link.click();


URL.revokeObjectURL(url);

}


// --------------------------------
// CSV ESCAPE
// --------------------------------

function csvEscape(value){

return '"' +
String(value || "")
.replace(/"/g,'""') +
'"';

}


// --------------------------------
// HTML SECURITY
// --------------------------------

function escapeHTML(value){

return String(value || "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

</script>


</body>

</html>
