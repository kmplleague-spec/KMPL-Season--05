
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KMPL Season 05 - Team Players</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0d12;
  color: #ffffff;
}

header {
  text-align: center;
  padding: 26px 12px;
  background: linear-gradient(135deg, #151515, #252525);
  border-bottom: 3px solid #e9b949;
}

header h1 {
  margin: 0;
  color: #f5c451;
  font-size: 27px;
}

header p {
  margin: 8px 0 0;
  color: #dddddd;
  font-size: 13px;
  letter-spacing: 1px;
}

.container {
  width: 100%;
  max-width: 1150px;
  margin: auto;
  padding: 16px;
}

.controls {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
  margin-bottom: 15px;
}

input, select, button {
  width: 100%;
  min-height: 45px;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #383d49;
  background: #171a22;
  color: white;
  font-size: 15px;
}

button {
  background: #e9b949;
  color: #151515;
  font-weight: bold;
  border: none;
  cursor: pointer;
}

.summary {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin: 18px 0;
}

.summary-box {
  background: #171a22;
  border: 1px solid #303542;
  border-radius: 10px;
  text-align: center;
  padding: 13px 5px;
}

.summary-box strong {
  display: block;
  color: #f5c451;
  font-size: 22px;
}

.summary-box span {
  display: block;
  color: #c4c7d0;
  font-size: 11px;
  margin-top: 5px;
}

.section-title {
  margin: 20px 0 12px;
  color: #f5c451;
  font-size: 18px;
}

.player-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 13px;
}

.player-card {
  background: #171a22;
  border: 1px solid #343947;
  border-radius: 12px;
  padding: 16px;
  overflow-wrap: anywhere;
}

.player-name {
  font-size: 19px;
  font-weight: bold;
  color: #ffffff;
  margin-bottom: 8px;
}

.reg-number {
  display: inline-block;
  font-size: 12px;
  color: #f5c451;
  background: #2b281e;
  padding: 5px 8px;
  border-radius: 5px;
  margin-bottom: 12px;
}

.detail {
  font-size: 14px;
  color: #d5d7de;
  margin: 7px 0;
  line-height: 1.5;
}

.detail strong {
  color: #ffffff;
}

.auction-box {
  margin-top: 13px;
  padding: 12px;
  border-radius: 9px;
  background: #10131a;
  border: 1px solid #343947;
}

.auction-heading {
  color: #f5c451;
  font-weight: bold;
  font-size: 13px;
  margin-bottom: 9px;
}

.status {
  display: inline-block;
  margin-top: 5px;
  padding: 5px 9px;
  border-radius: 5px;
  font-size: 12px;
  font-weight: bold;
}

.status-sold {
  color: #7ff0ad;
  background: #123523;
}

.status-unsold {
  color: #ffb1b1;
  background: #3a2020;
}

.status-pending {
  color: #ffdf89;
  background: #3b3018;
}

.message {
  text-align: center;
  padding: 30px 12px;
  color: #c5c8d1;
  background: #171a22;
  border-radius: 10px;
  margin-top: 12px;
}

.footer {
  text-align: center;
  padding: 25px 10px;
  color: #8d929e;
  font-size: 12px;
}

@media (min-width: 600px) {
  .controls {
    grid-template-columns: 2fr 2fr 1fr;
  }

  .player-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  header h1 {
    font-size: 34px;
  }
}

@media (min-width: 950px) {
  .player-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}
</style>
</head>

<body>

<header>
  <h1>KMPL SEASON 05</h1>
  <p>PLAYER LIST & AUCTION RESULTS</p>
</header>

<main class="container">

  <div class="controls">
    <input
      type="search"
      id="searchInput"
      placeholder="Search player name or registration number..."
      aria-label="Search players"
    >

    <select id="teamFilter" aria-label="Filter by team">
      <option value="">All Teams</option>
      <option>VOLCANO VARANJOOR</option>
      <option>DRAGON BOOSTER NATTAKAL</option>
      <option>RAJEEVIJI KALLIOT</option>
      <option>ACADEMY BOYS BANDHADUKA</option>
      <option>KIWIS KASARAGOD</option>
      <option>RSA NILESHWARAM</option>
      <option>FC CHEMBENCHERY</option>
      <option>CHAMPIONS AZAD</option>
      <option>SUPER STRIKERS ERUMAKULAM</option>
      <option>OPTICS PERIYA</option>
      <option>GMC THAIRA</option>
      <option>MARX KONNAKKAD</option>
      <option>WINDIES MARIKULAM</option>
      <option>KALLAI BROTHERS</option>
      <option>RAM BROTHERS PERIYA</option>
      <option>GREEN STAR KOLLADA</option>
    </select>

    <button id="refreshButton" type="button">
      ↻ Refresh Players
    </button>
  </div>

  <div class="summary">
    <div class="summary-box">
      <strong id="totalCount">0</strong>
      <span>TOTAL PLAYERS</span>
    </div>

    <div class="summary-box">
      <strong id="soldCount">0</strong>
      <span>SOLD</span>
    </div>

    <div class="summary-box">
      <strong id="unsoldCount">0</strong>
      <span>UNSOLD</span>
    </div>
  </div>

  <h2 class="section-title">Registered Players</h2>

  <div id="message" class="message">
    Loading players...
  </div>

  <div id="playerGrid" class="player-grid"></div>

</main>

<div class="footer">
  GOLDEN WINGS PRESENTS · KMPL SEASON 05
</div>

<script>
"use strict";

const API_URL =
  "https://script.google.com/macros/s/AKfycbx4_dUYrVPQEQjjWThl0q2vxYTt1SntdunMQbkN7LSV3t3JwiPhJgYTVkJQMJiI8PduSA/exec?action=publicPlayers";

let allPlayers = [];

const playerGrid = document.getElementById("playerGrid");
const message = document.getElementById("message");
const searchInput = document.getElementById("searchInput");
const teamFilter = document.getElementById("teamFilter");
const refreshButton = document.getElementById("refreshButton");

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, function(char) {
    const map = {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    };
    return map[char];
  });
}

function getValue(player, keys) {
  for (const key of keys) {
    if (
      player[key] !== undefined &&
      player[key] !== null &&
      player[key] !== ""
    ) {
      return player[key];
    }
  }
  return "";
}

function normalizeStatus(player) {
  const raw = getValue(player, [
    "auctionStatus",
    "auction_status",
    "Auction Status",
    "status"
  ]);

  const status = String(raw || "PENDING").trim().toUpperCase();

  if (status === "SOLD") return "SOLD";
  if (status === "UNSOLD") return "UNSOLD";

  return "PENDING";
}

function formatPrice(value) {
  if (value === "" || value === null || value === undefined) {
    return "—";
  }

  const number = Number(value);

  if (!Number.isFinite(number)) {
    return escapeHTML(value);
  }

  return "₹" + number.toLocaleString("en-IN");
}

function renderPlayers() {
  const search = searchInput.value.trim().toLowerCase();
  const selectedTeam = teamFilter.value.trim().toLowerCase();

  const filtered = allPlayers.filter(function(player) {
    const name = String(getValue(player, [
      "name", "Name"
    ])).toLowerCase();

    const reg = String(getValue(player, [
      "registrationNumber",
      "registration_number",
      "Registration Number"
    ])).toLowerCase();

    const previousTeam = String(getValue(player, [
      "team", "previousTeam", "previous_team", "Previous Team"
    ])).trim();

    const soldTeam = String(getValue(player, [
      "soldTeam", "sold_team", "Sold Team"
    ])).trim();

    const status = normalizeStatus(player);

    const teamForFilter =
      status === "SOLD" && soldTeam ? soldTeam : previousTeam;

    const matchesSearch =
      name.includes(search) || reg.includes(search);

    const matchesTeam =
      !selectedTeam ||
      teamForFilter.toLowerCase() === selectedTeam;

    return matchesSearch && matchesTeam;
  });

  document.getElementById("totalCount").textContent =
    allPlayers.length;

  document.getElementById("soldCount").textContent =
    allPlayers.filter(p => normalizeStatus(p) === "SOLD").length;

  document.getElementById("unsoldCount").textContent =
    allPlayers.filter(p => normalizeStatus(p) === "UNSOLD").length;

  playerGrid.innerHTML = "";

  if (filtered.length === 0) {
    message.style.display = "block";
    message.textContent = allPlayers.length
      ? "No matching players found."
      : "No players found.";
    return;
  }

  message.style.display = "none";

  filtered.forEach(function(player) {
    const name = getValue(player, ["name", "Name"]) || "Unnamed Player";

    const reg = getValue(player, [
      "registrationNumber",
      "registration_number",
      "Registration Number"
    ]) || "—";

    const role = getValue(player, ["role", "Role"]) || "—";

    const previousTeam = getValue(player, [
      "team", "previousTeam", "previous_team", "Previous Team"
    ]) || "—";

    const soldTeam = getValue(player, [
      "soldTeam", "sold_team", "Sold Team"
    ]);

    const soldPrice = getValue(player, [
      "soldPrice", "sold_price", "Sold Price"
    ]);

    const status = normalizeStatus(player);

    let statusClass = "status-pending";
    let statusLabel = "PENDING";

    if (status === "SOLD") {
      statusClass = "status-sold";
      statusLabel = "SOLD";
    } else if (status === "UNSOLD") {
      statusClass = "status-unsold";
      statusLabel = "UNSOLD";
    }

    const auctionTeam =
      status === "SOLD" && soldTeam ? soldTeam : "—";

    const price =
      status === "SOLD" ? formatPrice(soldPrice) : "—";

    const card = document.createElement("article");
    card.className = "player-card";

    card.innerHTML = `
      <div class="player-name">${escapeHTML(name)}</div>

      <div class="reg-number">
        REG NO: ${escapeHTML(reg)}
      </div>

      <div class="detail">
        <strong>Role:</strong> ${escapeHTML(role)}
      </div>

      <div class="detail">
        <strong>Previous Team:</strong>
        ${escapeHTML(previousTeam)}
      </div>

      <div class="auction-box">
        <div class="auction-heading">AUCTION RESULT</div>

        <div class="detail">
          <strong>Auction Team:</strong>
          ${escapeHTML(auctionTeam)}
        </div>

        <div class="detail">
          <strong>Sold Price:</strong>
          ${price}
        </div>

        <div class="detail">
          <strong>Status:</strong><br>
          <span class="status ${statusClass}">
            ${statusLabel}
          </span>
        </div>
      </div>
    `;

    playerGrid.appendChild(card);
  });
}

async function loadPlayers() {
  refreshButton.disabled = true;
  refreshButton.textContent = "Loading...";
  message.style.display = "block";
  message.textContent = "Loading players...";

  try {
    const response = await fetch(API_URL, {
      method: "GET",
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const result = await response.json();

    if (result.success !== true || !Array.isArray(result.players)) {
      throw new Error(result.message || "Invalid API response");
    }

    allPlayers = result.players;
    renderPlayers();

  } catch (error) {
    console.error("KMPL player loading error:", error);

    playerGrid.innerHTML = "";
    message.style.display = "block";
    message.textContent =
      "Players load ചെയ്യാൻ കഴിഞ്ഞില്ല. Internet, Apps Script deployment എന്നിവ പരിശോധിച്ച് Refresh അമർത്തുക.";
  } finally {
    refreshButton.disabled = false;
    refreshButton.textContent = "↻ Refresh Players";
  }
}

searchInput.addEventListener("input", renderPlayers);
teamFilter.addEventListener("change", renderPlayers);
refreshButton.addEventListener("click", loadPlayers);

loadPlayers();
</script>

</body>
</html>
