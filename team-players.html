
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KMPL Season 05 - Team Players</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #101010;
  color: #fff;
}

.header {
  padding: 25px 15px;
  text-align: center;
  background: linear-gradient(135deg, #151515, #252525);
  border-bottom: 3px solid #f5bd35;
}

.header h1 {
  margin: 0;
  color: #f5bd35;
  font-size: 27px;
}

.header p {
  margin: 8px 0 0;
  color: #ddd;
  font-size: 14px;
}

.container {
  width: 100%;
  max-width: 1000px;
  margin: auto;
  padding: 18px;
}

.controls {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
  margin-bottom: 18px;
}

select,
input,
button {
  width: 100%;
  padding: 13px;
  border-radius: 8px;
  border: 1px solid #444;
  font-size: 15px;
}

select,
input {
  background: #202020;
  color: white;
}

button {
  background: #f5bd35;
  color: #111;
  border: none;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .6;
  cursor: wait;
}

.summary {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  padding: 14px;
  margin-bottom: 16px;
  background: #1d1d1d;
  border: 1px solid #383838;
  border-radius: 10px;
}

.summary strong {
  color: #f5bd35;
}

#status {
  text-align: center;
  padding: 25px 10px;
  color: #f5bd35;
  line-height: 1.7;
  overflow-wrap: anywhere;
}

#players {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 13px;
}

.player-card {
  padding: 16px;
  background: #1d1d1d;
  border: 1px solid #393939;
  border-left: 4px solid #f5bd35;
  border-radius: 10px;
  overflow-wrap: anywhere;
}

.player-number {
  color: #f5bd35;
  font-size: 12px;
  margin-bottom: 8px;
}

.player-name {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 10px;
}

.player-detail {
  color: #ccc;
  font-size: 13px;
  line-height: 1.8;
}

.team-name {
  color: #f5bd35;
  font-weight: bold;
}

.empty {
  grid-column: 1 / -1;
  text-align: center;
  padding: 25px;
  background: #1d1d1d;
  border-radius: 10px;
  color: #ccc;
}

.footer {
  text-align: center;
  padding: 22px 10px;
  color: #888;
  font-size: 12px;
}

@media (min-width: 650px) {
  .controls {
    grid-template-columns: 1fr 1fr auto;
  }

  .controls button {
    width: auto;
    min-width: 120px;
  }
}
</style>
</head>

<body>

<header class="header">
  <h1>🏏 KMPL SEASON 05</h1>
  <p>OFFICIAL TEAM PLAYERS LIST</p>
</header>

<main class="container">

  <div class="controls">
    <select id="teamFilter">
      <option value="">All Teams</option>
    </select>

    <input
      id="searchInput"
      type="search"
      placeholder="Search player name or registration number..."
      autocomplete="off"
    >

    <button id="refreshButton" type="button">
      ↻ Refresh
    </button>
  </div>

  <div class="summary">
    <div>Teams: <strong id="teamCount">16</strong></div>
    <div>Players: <strong id="playerCount">0</strong></div>
  </div>

  <div id="status" role="status" aria-live="polite">
    Loading players...
  </div>

  <section id="players"></section>

</main>

<footer class="footer">
  GOLDEN WINGS PRESENTS · KMPL SEASON 05
</footer>

<script>
"use strict";

/* ======================================
   GOOGLE APPS SCRIPT PUBLIC API
====================================== */

const API_URL =
  "https://script.google.com/macros/s/AKfycbx4_dUYrVPQEQjjWThl0q2vxYTt1SntdunMQbkN7LSV3t3JwiPhJgYTVkJQMJiI8PduSA/exec?action=publicPlayers";

/* ======================================
   KMPL SEASON 05 TEAMS
====================================== */

const teams = [
  "VOLCANO VARANJOOR",
  "DRAGON BOOSTER NATTAKAL",
  "RAJEEVIJI KALLIOT",
  "ACADEMY BOYS BANDHADUKA",
  "KIWIS KASARAGOD",
  "RSA NILESHWARAM",
  "FC CHEMBENCHERY",
  "CHAMPIONS AZAD",
  "SUPER STRIKERS ERUMAKULAM",
  "OPTICS PERIYA",
  "GMC THAIRA",
  "MARX KONNAKKAD",
  "WINDIES MARIKULAM",
  "KALLAI BROTHERS",
  "RAM BROTHERS PERIYA",
  "GREEN STAR KOLLADA"
];

let allPlayers = [];

const teamFilter = document.getElementById("teamFilter");
const searchInput = document.getElementById("searchInput");
const playersContainer = document.getElementById("players");
const statusBox = document.getElementById("status");
const playerCount = document.getElementById("playerCount");
const teamCount = document.getElementById("teamCount");
const refreshButton = document.getElementById("refreshButton");

/* ======================================
   INITIALIZE TEAM DROPDOWN
====================================== */

function initializeTeams() {
  teamFilter.innerHTML = "";

  const allOption = document.createElement("option");
  allOption.value = "";
  allOption.textContent = "All Teams";
  teamFilter.appendChild(allOption);

  teams.forEach(function(team) {
    const option = document.createElement("option");
    option.value = team;
    option.textContent = team;
    teamFilter.appendChild(option);
  });

  teamCount.textContent = teams.length;
}

/* ======================================
   SAFE FIELD HELPERS
====================================== */

function getValue(player, keys) {
  for (const key of keys) {
    if (
      player &&
      player[key] !== undefined &&
      player[key] !== null &&
      String(player[key]).trim() !== ""
    ) {
      return String(player[key]).trim();
    }
  }

  return "";
}

function normalizeTeam(value) {
  return String(value || "")
    .trim()
    .toUpperCase()
    .replace(/\s+/g, " ");
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, function(character) {
    const replacements = {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    };

    return replacements[character];
  });
}

/* ======================================
   LOAD PLAYERS
====================================== */

async function loadPlayers() {
  statusBox.style.display = "block";
  statusBox.textContent = "Loading players...";
  playersContainer.innerHTML = "";

  refreshButton.disabled = true;
  refreshButton.textContent = "Loading...";

  try {
    const response = await fetch(API_URL, {
      method: "GET",
      cache: "no-store",
      redirect: "follow"
    });

    if (!response.ok) {
      throw new Error("HTTP error: " + response.status);
    }

    const result = await response.json();

    console.log("KMPL API response:", result);

    if (!result || result.success !== true) {
      throw new Error(
        result && result.error
          ? result.error
          : "API did not return success:true"
      );
    }

    if (!Array.isArray(result.players)) {
      throw new Error("API response does not contain a players array");
    }

    allPlayers = result.players;

    statusBox.style.display = "none";
    renderPlayers();

  } catch (error) {
    console.error("KMPL loading error:", error);

    allPlayers = [];
    playerCount.textContent = "0";
    playersContainer.innerHTML = "";

    statusBox.style.display = "block";
    statusBox.textContent =
      "Unable to load players: " + error.message;

  } finally {
    refreshButton.disabled = false;
    refreshButton.textContent = "↻ Refresh";
  }
}

/* ======================================
   FILTER AND DISPLAY PLAYERS
====================================== */

function renderPlayers() {
  const selectedTeam = normalizeTeam(teamFilter.value);
  const searchText = searchInput.value.trim().toLowerCase();

  const filteredPlayers = allPlayers.filter(function(player) {
    const name = getValue(player, [
      "playerName",
      "player_name",
      "name",
      "Player Name",
      "Name"
    ]);

    const registration = getValue(player, [
      "registrationNumber",
      "registration_number",
      "Registration Number"
    ]);

    const team = getValue(player, [
      "teamName",
      "team",
      "team_name",
      "Team Name",
      "Team"
    ]);

    const matchesTeam =
      !selectedTeam || normalizeTeam(team) === selectedTeam;

    const searchableText =
      (name + " " + registration + " " + team).toLowerCase();

    const matchesSearch =
      !searchText || searchableText.includes(searchText);

    return matchesTeam && matchesSearch;
  });

  playerCount.textContent = filteredPlayers.length;
  playersContainer.innerHTML = "";

  if (filteredPlayers.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = allPlayers.length
      ? "No players match this filter. Team assignment may not be available in the API."
      : "No registered players found.";

    playersContainer.appendChild(empty);
    return;
  }

  filteredPlayers.forEach(function(player, index) {
    const name = getValue(player, [
      "playerName",
      "player_name",
      "name",
      "Player Name",
      "Name"
    ]) || "Unnamed Player";

    const registration = getValue(player, [
      "registrationNumber",
      "registration_number",
      "Registration Number"
    ]) || "Not available";

    const role = getValue(player, [
      "role",
      "playerRole",
      "position",
      "Role"
    ]) || "Not specified";

    const team = getValue(player, [
      "teamName",
      "team",
      "team_name",
      "Team Name",
      "Team"
    ]) || "Previous team not specified";

    const card = document.createElement("article");
    card.className = "player-card";

    const number = document.createElement("div");
    number.className = "player-number";
    number.textContent = "PLAYER " + (index + 1);

    const playerName = document.createElement("div");
    playerName.className = "player-name";
    playerName.textContent = name;

    const registrationLine = document.createElement("div");
    registrationLine.className = "player-detail";
    registrationLine.textContent = "Registration: " + registration;

    const teamLine = document.createElement("div");
    teamLine.className = "player-detail";

    const teamLabel = document.createElement("span");
    teamLabel.className = "team-name";
    teamLabel.textContent = team;

    teamLine.appendChild(teamLabel);

    const roleLine = document.createElement("div");
    roleLine.className = "player-detail";
    roleLine.textContent = "Role: " + role;

    card.appendChild(number);
    card.appendChild(playerName);
    card.appendChild(registrationLine);
    card.appendChild(teamLine);
    card.appendChild(roleLine);

    playersContainer.appendChild(card);
  });
}

/* ======================================
   EVENTS
====================================== */

teamFilter.addEventListener("change", renderPlayers);
searchInput.addEventListener("input", renderPlayers);
refreshButton.addEventListener("click", loadPlayers);

/* ======================================
   START
====================================== */

initializeTeams();
loadPlayers();

</script>
</body>
</html>
