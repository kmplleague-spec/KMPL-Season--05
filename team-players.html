
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KMPL Season 05 - Team Players</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #101010;
  color: #ffffff;
}

.header {
  padding: 25px 15px;
  text-align: center;
  background: linear-gradient(135deg, #151515, #252525);
  border-bottom: 3px solid #f5bd35;
}

.header h1 {
  margin: 0;
  color: #f5bd35;
  font-size: 27px;
}

.header p {
  margin: 8px 0 0;
  color: #dddddd;
  font-size: 14px;
}

.container {
  width: 100%;
  max-width: 1000px;
  margin: auto;
  padding: 18px;
}

.controls {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
  margin-bottom: 18px;
}

select,
input,
button {
  width: 100%;
  padding: 13px;
  border-radius: 8px;
  border: 1px solid #444;
  font-size: 15px;
}

select,
input {
  background: #202020;
  color: white;
}

button {
  background: #f5bd35;
  color: #111;
  border: none;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  transform: scale(0.99);
}

.summary {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  padding: 14px;
  margin-bottom: 16px;
  background: #1d1d1d;
  border: 1px solid #383838;
  border-radius: 10px;
}

.summary strong {
  color: #f5bd35;
}

#status {
  text-align: center;
  padding: 25px 10px;
  color: #f5bd35;
  line-height: 1.7;
}

#players {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 13px;
}

.player-card {
  padding: 16px;
  background: #1d1d1d;
  border: 1px solid #393939;
  border-left: 4px solid #f5bd35;
  border-radius: 10px;
  overflow-wrap: anywhere;
}

.player-number {
  color: #f5bd35;
  font-size: 12px;
  margin-bottom: 8px;
}

.player-name {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 10px;
}

.player-detail {
  color: #cccccc;
  font-size: 13px;
  line-height: 1.8;
}

.team-name {
  color: #f5bd35;
  font-weight: bold;
}

.empty {
  grid-column: 1 / -1;
  text-align: center;
  padding: 25px;
  background: #1d1d1d;
  border-radius: 10px;
  color: #cccccc;
}

.footer {
  text-align: center;
  padding: 22px 10px;
  color: #888888;
  font-size: 12px;
}

@media (min-width: 650px) {
  .controls {
    grid-template-columns: 1fr 1fr auto;
  }

  .controls button {
    width: auto;
    min-width: 120px;
  }
}
</style>
</head>

<body>

<header class="header">
  <h1>🏏 KMPL SEASON 05</h1>
  <p>OFFICIAL TEAM PLAYERS LIST</p>
</header>

<main class="container">

  <div class="controls">
    <select id="teamFilter">
      <option value="">All Teams</option>
    </select>

    <input
      id="searchInput"
      type="search"
      placeholder="Search player name..."
      autocomplete="off"
    >

    <button id="refreshButton" type="button">
      ↻ Refresh
    </button>
  </div>

  <div class="summary">
    <div>Teams: <strong id="teamCount">16</strong></div>
    <div>Players: <strong id="playerCount">0</strong></div>
  </div>

  <div id="status" role="status" aria-live="polite">
    Loading players...
  </div>

  <section id="players"></section>

</main>

<footer class="footer">
  GOLDEN WINGS PRESENTS · KMPL SEASON 05
</footer>

<script>
"use strict";

/* ======================================
   KMPL SEASON 05 TEAM PLAYERS SETTINGS
====================================== */

const API_URL =
  "https://script.google.com/macros/s/AKfycbx4_dUYrVPQEQjjWThl0q2vxYTt1SntdunMQbkN7LSV3t3JwiPhJgYTVkJQMJiI8PduSA/exec";

const teams = [
  "VOLCANO VARANJOOR",
  "DRAGON BOOSTER NATTAKAL",
  "RAJEEVIJI KALLIOT",
  "ACADEMY BOYS BANDHADUKA",
  "KIWIS KASARAGOD",
  "RSA NILESHWARAM",
  "FC CHEMBENCHERY",
  "CHAMPIONS AZAD",
  "SUPER STRIKERS ERUMAKULAM",
  "OPTICS PERIYA",
  "GMC THAIRA",
  "MARX KONNAKKAD",
  "WINDIES MARIKULAM",
  "KALLAI BROTHERS",
  "RAM BROTHERS PERIYA",
  "GREEN STAR KOLLADA"
];

let allPlayers = [];

const teamFilter = document.getElementById("teamFilter");
const searchInput = document.getElementById("searchInput");
const playersContainer = document.getElementById("players");
const statusBox = document.getElementById("status");
const playerCount = document.getElementById("playerCount");
const teamCount = document.getElementById("teamCount");
const refreshButton = document.getElementById("refreshButton");

/* ======================================
   INITIALIZE TEAM DROPDOWN
====================================== */

function initializeTeams() {
  teamFilter.innerHTML = '<option value="">All Teams</option>';

  teams.forEach(function(team) {
    const option = document.createElement("option");
    option.value = team;
    option.textContent = team;
    teamFilter.appendChild(option);
  });

  teamCount.textContent = teams.length;
}

/* ======================================
   SAFE VALUE HELPERS
====================================== */

function getValue(player, keys) {
  for (const key of keys) {
    if (
      player &&
      player[key] !== undefined &&
      player[key] !== null &&
      String(player[key]).trim() !== ""
    ) {
      return String(player[key]).trim();
    }
  }

  return "";
}

function normalizeTeam(value) {
  return String(value || "")
    .trim()
    .toUpperCase()
    .replace(/\s+/g, " ");
}

/* ======================================
   LOAD PLAYERS FROM GOOGLE APPS SCRIPT
====================================== */

async function loadPlayers() {
  statusBox.style.display = "block";
  statusBox.textContent = "Loading players...";
  playersContainer.innerHTML = "";
  refreshButton.disabled = true;
  refreshButton.textContent = "Loading...";

  try {
    const response = await fetch(API_URL, {
      method: "GET",
      redirect: "follow",
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("Server returned HTTP " + response.status);
    }

    const result = await response.json();

    if (Array.isArray(result)) {
      allPlayers = result;
    } else if (result && result.success === true &&
               Array.isArray(result.players)) {
      allPlayers = result.players;
    } else if (result && Array.isArray(result.players)) {
      allPlayers = result.players;
    } else {
      throw new Error(
        result && result.message
          ? result.message
          : "The API did not return a players list."
      );
    }

    statusBox.style.display = "none";
    renderPlayers();

  } catch (error) {
    console.error("KMPL players loading error:", error);

    allPlayers = [];
    playerCount.textContent = "0";
    playersContainer.innerHTML = "";

    statusBox.style.display = "block";
    statusBox.innerHTML =
      "❌ Unable to load players.<br><br>" +
      "Please check the Google Apps Script deployment and API response." +
      "<br><br><small>" + escapeHTML(error.message) + "</small>";
  } finally {
    refreshButton.disabled = false;
    refreshButton.textContent = "↻ Refresh";
  }
}

/* ======================================
   DISPLAY PLAYERS
====================================== */

function renderPlayers() {
  const selectedTeam = normalizeTeam(teamFilter.value);
  const searchText = searchInput.value.trim().toLowerCase();

  const filteredPlayers = allPlayers.filter(function(player) {
    const name = getValue(player, [
      "playerName",
      "player_name",
      "name",
      "Player Name",
      "Name"
    ]);

    const team = getValue(player, [
      "teamName",
      "team",
      "team_name",
      "Team Name",
      "Team"
    ]);

    const matchesTeam =
      !selectedTeam || normalizeTeam(team) === selectedTeam;

    const matchesSearch =
      !searchText ||
      name.toLowerCase().includes(searchText) ||
      team.toLowerCase().includes(searchText);

    return matchesTeam && matchesSearch;
  });

  playerCount.textContent = filteredPlayers.length;
  playersContainer.innerHTML = "";

  if (filteredPlayers.length === 0) {
    playersContainer.innerHTML =
      '<div class="empty">No players found.</div>';
    return;
  }

  filteredPlayers.forEach(function(player, index) {
    const name = getValue(player, [
      "playerName",
      "player_name",
      "name",
      "Player Name",
      "Name"
    ]) || "Unnamed Player";

    const team = getValue(player, [
      "teamName",
      "team",
      "team_name",
      "Team Name",
      "Team"
    ]) || "Team not specified";

    const role = getValue(player, [
      "role",
      "playerRole",
      "position",
      "Role"
    ]);

    const status = getValue(player, [
      "status",
      "playerStatus",
      "Status"
    ]);

    const card = document.createElement("article");
    card.className = "player-card";

    const number = document.createElement("div");
    number.className = "player-number";
    number.textContent = "PLAYER " + (index + 1);

    const playerName = document.createElement("div");
    playerName.className = "player-name";
    playerName.textContent = name;

    const teamLine = document.createElement("div");
    teamLine.className = "player-detail";

    const teamLabel = document.createElement("span");
    teamLabel.className = "team-name";
    teamLabel.textContent = team;

    teamLine.appendChild(teamLabel);

    card.appendChild(number);
    card.appendChild(playerName);
    card.appendChild(teamLine);

    if (role) {
      const roleLine = document.createElement("div");
      roleLine.className = "player-detail";
      roleLine.textContent = "Role: " + role;
      card.appendChild(roleLine);
    }

    if (status) {
      const statusLine = document.createElement("div");
      statusLine.className = "player-detail";
      statusLine.textContent = "Status: " + status;
      card.appendChild(statusLine);
    }

    playersContainer.appendChild(card);
  });
}

/* ======================================
   ESCAPE ERROR TEXT
====================================== */

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, function(character) {
    const replacements = {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    };

    return replacements[character];
  });
}

/* ======================================
   EVENTS
====================================== */

teamFilter.addEventListener("change", renderPlayers);
searchInput.addEventListener("input", renderPlayers);
refreshButton.addEventListener("click", loadPlayers);

/* ======================================
   START PAGE
====================================== */

initializeTeams();
loadPlayers();

</script>
</body>
</html>
